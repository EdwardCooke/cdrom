services:
  nginx:
    build: nginx/.
    ports:
    - 8443:8443
    depends_on:
    - mailcrab
    - oidc-toolkit

  mailcrab:
    image: marlonb/mailcrab:latest
    environment:
    - MAILCRAB_PREFIX=mail
    ports:
    - 1080:1080

  oidc-toolkit:
    image: ghcr.io/businesssimulations/dev-oidc-toolkit:latest
    environment:
      - ASPNETCORE_URLS=http://+:8443/auth/
      - DevOidcToolkit__Port=8443
      - DevOidcToolkit__Database__SqliteFile=/app/data/oidc-toolkit.db
      - DevOidcToolkit__Users__0__Email=test@localhost
      - DevOidcToolkit__Users__0__FirstName=Test
      - DevOidcToolkit__Users__0__LastName=User
      - DevOidcToolkit__Users__1__Email=test2@localhost
      - DevOidcToolkit__Users__1__FirstName=Test2
      - DevOidcToolkit__Users__1__LastName=User2
      - DevOidcToolkit__Clients__0__Id=client
      - DevOidcToolkit__Clients__0__Secret=secret
      - DevOidcToolkit__Clients__0__RedirectUris__INDEX=http://localhost:3000/auth/callback
    volumes:
      - data:/app/data
    depends_on:
      - mailcrab

  database:
    build:
      context: ../
      dockerfile: Dockerfile
      target: db
    env_file:
    - env
    environment:
    # Metrics (F-20): serve /metrics + /healthz on a dedicated port.
    - CDROM_METRICS_ADDR=0.0.0.0:9101
    ports:
    - 9101:9101
    volumes:
    - database:/data
  idp:
    build:
      context: ../
      dockerfile: Dockerfile
      target: idp
    depends_on:
    - database
    env_file:
    - env
    environment:
    - CDROM_IDP_GRPC_ADDR=0.0.0.0:8081
    # Metrics (F-20): serve /metrics + /healthz on a dedicated port.
    - CDROM_METRICS_ADDR=0.0.0.0:9105
    ports:
    - 9105:9105
  artifacts:
    build:
      context: ../
      dockerfile: Dockerfile
      target: artifacts
    env_file:
    - env
    environment:
    # Metrics (F-20): serve /metrics + /healthz on a dedicated port.
    - CDROM_METRICS_ADDR=0.0.0.0:9103
    ports:
    - 9103:9103
    volumes:
    - artifacts:/data
  scheduler:
    build:
      context: ../
      dockerfile: Dockerfile
      target: scheduler
    depends_on:
    - database
    - api
    env_file:
    - env
    environment:
    # Metrics (F-20): serve /metrics + /healthz on a dedicated port.
    - CDROM_METRICS_ADDR=0.0.0.0:9102
    ports:
    - 9102:9102
  api:
    build:
      context: ../
      dockerfile: Dockerfile
      target: api
    depends_on:
    - database
    - artifacts
    env_file:
    - env
    environment:
    # Metrics (F-20): serve /metrics + /healthz on a dedicated port.
    - CDROM_METRICS_ADDR=0.0.0.0:9104
    ports:
    - 9104:9104
volumes:
  data:
  artifacts:
  database:

