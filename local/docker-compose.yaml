services:
  nginx:
    build: nginx/.
    ports:
    - 8443:8443
    depends_on:
    - mailcrab
    - oidc-toolkit

  mailcrab:
    image: marlonb/mailcrab:latest
    environment:
    - MAILCRAB_PREFIX=mail
    ports:
    - 1080:1080

  oidc-toolkit:
    image: ghcr.io/businesssimulations/dev-oidc-toolkit:latest
    environment:
      - ASPNETCORE_URLS=http://+:8443/auth/
      - DevOidcToolkit__Port=8443
      - DevOidcToolkit__Database__SqliteFile=/app/data/oidc-toolkit.db
      - DevOidcToolkit__Users__0__Email=test@localhost
      - DevOidcToolkit__Users__0__FirstName=Test
      - DevOidcToolkit__Users__0__LastName=User
      - DevOidcToolkit__Users__1__Email=test2@localhost
      - DevOidcToolkit__Users__1__FirstName=Test2
      - DevOidcToolkit__Users__1__LastName=User2
      - DevOidcToolkit__Clients__0__Id=client
      - DevOidcToolkit__Clients__0__Secret=secret
      - DevOidcToolkit__Clients__0__RedirectUris__INDEX=http://localhost:3000/auth/callback
    volumes:
      - data:/app/data
    depends_on:
      - mailcrab
#	DefaultDBAddress        = "127.0.0.1:7101"
#	DefaultSchedulerAddress = "127.0.0.1:7102"
#	DefaultArtifactsAddress = "127.0.0.1:7103"
#	// DefaultAPIAddress is the gRPC address of the API service (the control
#	// plane that workers, agents, and the scheduler dial).
#	DefaultAPIAddress = "127.0.0.1:7105"
#	// DefaultAPIHTTPAddress is the HTTP address the API binds for the UI.
#	DefaultAPIHTTPAddress = "127.0.0.1:8080"
#	// DefaultIdPAddress is the HTTP address the local OIDC identity provider
#	// (cmd/idp) binds to (its OIDC surface: discovery, JWKS, /auth, /token).
#	DefaultIdPAddress = "127.0.0.1:7104"
#	// DefaultIdPGRPCAddress is the gRPC address the local OIDC identity
#	// provider (cmd/idp) binds to for its API-only surface (job-token minting
#	// and user management), which the API dials over mTLS.
#	DefaultIdPGRPCAddress = "127.0.0.1:7106"

  database:
    build:
      context: ../
      dockerfile: Dockerfile
      target: db
    env_file:
    - env
    volumes:
    - database:/data
  idp:
    build:
      context: ../
      dockerfile: Dockerfile
      target: idp
    depends_on:
    - database
    env_file:
    - env
    environment:
    - CDROM_IDP_GRPC_ADDR=0.0.0.0:8081
  artifacts:
    build:
      context: ../
      dockerfile: Dockerfile
      target: artifacts
    env_file:
    - env
    volumes:
    - artifacts:/data
  scheduler:
    build:
      context: ../
      dockerfile: Dockerfile
      target: scheduler
    depends_on:
    - database
    - api
    env_file:
    - env
  api:
    build:
      context: ../
      dockerfile: Dockerfile
      target: api
    depends_on:
    - database
    - artifacts
    env_file:
    - env
volumes:
  data:
  artifacts:
  database:

