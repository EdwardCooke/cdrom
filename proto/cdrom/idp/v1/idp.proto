syntax = "proto3";

package cdrom.idp.v1;

import "cdrom/db/v1/db.proto";
import "google/protobuf/duration.proto";

option go_package = "cdrom/internal/gen/cdrom/idp/v1;idpv1";

// IdP is the gRPC surface of the local OIDC identity provider. It carries the
// IdP's API-only operations: minting job tokens and managing the user
// directory (username/password authentication). The API is the sole caller and
// authenticates to the IdP with its mTLS client certificate (when TLS is
// configured), so only a CA-signed client (the API) can mint job tokens or
// manage users.
//
// The standard OIDC surface (discovery, JWKS, the authorization endpoint, and
// the authorization_code token grant) is served over HTTP, because it is a
// browser-based protocol (redirects) that cannot be expressed as gRPC.
service IdP {
  // MintJobToken mints a job token for a dispatched job. The API is the only
  // caller; it authenticates with its mTLS client certificate. The token is
  // scoped to the job (job_id, pipeline_id, target_group) and to the API plus
  // any outside resources a job may call (audience). An empty audience makes
  // the IdP use its default job-token audiences. The token's lifetime is
  // expires_in when set, else the IdP's configured token lifetime.
  rpc MintJobToken(MintJobTokenRequest) returns (MintJobTokenResponse);

  // Login verifies a user's credentials (username + password) and returns
  // the OIDC token the IdP minted for the user (stamped with the user's
  // roles) plus the user's profile. A bad password or unknown user is
  // Unauthenticated.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Register creates a new user from the request's profile and password. The
  // password is hashed before it is stored. A duplicate username is
  // AlreadyExists.
  rpc Register(RegisterRequest) returns (cdrom.db.v1.IDPUser);
  // ListUsers returns all registered users (profile + roles, no password).
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // CreateUser creates a user (profile, password, and roles). A duplicate
  // username is AlreadyExists.
  rpc CreateUser(CreateUserRequest) returns (cdrom.db.v1.IDPUser);
  // UpdateUser updates a user's profile and/or roles (and password when
  // supplied), keyed by user ID. A missing user is NotFound.
  rpc UpdateUser(UpdateUserRequest) returns (cdrom.db.v1.IDPUser);
  // DeleteUser removes a user by ID. A missing user is NotFound.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // CreateAPIKey generates a new `cdrom-…` API key for a user, hashes it,
  // stores it, and returns the plaintext exactly once (in the response's
  // key field). The key's metadata (description, expiration, pipeline scope)
  // is set from the request. A key's expiration is validated to be at most
  // one year in the future. The RPC is Unimplemented when no user store is
  // attached.
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);
  // GetAPIKey returns a key's metadata and prefix (never the plaintext or
  // hash) by key id. A missing key is NotFound.
  rpc GetAPIKey(GetAPIKeyRequest) returns (cdrom.db.v1.IDPAPIKey);
  // ListAPIKeys returns API keys. When owner_id is set only that user's keys
  // are returned; when empty, all keys in the system are returned (an admin
  // listing every key). The plaintext is never returned.
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);
  // UpdateAPIKey edits a key's description, expiration, and/or pipeline scope
  // without changing its secret (a "renew"); the same `cdrom-…` value keeps
  // working. A missing key is NotFound.
  rpc UpdateAPIKey(UpdateAPIKeyRequest) returns (cdrom.db.v1.IDPAPIKey);
  // RotateAPIKey generates a brand-new `cdrom-…` secret for a key, returns it
  // exactly once (in the response's key field), and invalidates the previous
  // one. A missing key is NotFound.
  rpc RotateAPIKey(RotateAPIKeyRequest) returns (RotateAPIKeyResponse);
  // DeleteAPIKey removes a key by id. A missing key is NotFound.
  rpc DeleteAPIKey(DeleteAPIKeyRequest) returns (DeleteAPIKeyResponse);
  // VerifyAPIKey checks a presented `username:apikey` credential against the
  // stored key directory (hash, expiration, and the owner's lockout). On a
  // miss it increments the owner's failure counter and locks the owner out at
  // the configured maximum. A miss is Unauthenticated.
  rpc VerifyAPIKey(VerifyAPIKeyRequest) returns (VerifyAPIKeyResponse);
  // ResetAPIKeyLockout clears a user's API-key lockout state (the failed
  // counter and the lockout instant). A missing user is NotFound.
  rpc ResetAPIKeyLockout(ResetAPIKeyLockoutRequest) returns (ResetAPIKeyLockoutResponse);

  // Agent credentials (F-30.2). The IdP is the SOLE COMPONENT that mints the
  // JWTs: it signs them with its key ring and tracks their lifecycle in the
  // Database service's credential directory. The plaintext JWT is returned
  // EXACTLY ONCE (IssueAgentCredential / RotateAgentCredential) and is never
  // retrievable afterwards. The RPCs are Unimplemented when no credential
  // store is attached.
  // IssueAgentCredential signs a new credential for the named agent (deadline
  // = now + the configured TTL) and stores the row. Returns the plaintext JWT
  // once.
  rpc IssueAgentCredential(IssueAgentCredentialRequest) returns (IssueAgentCredentialResponse);
  // GetAgentCredential returns a row's METADATA (never JWT material) by id.
  rpc GetAgentCredential(GetAgentCredentialRequest) returns (cdrom.db.v1.AgentCredential);
  // ListAgentCredentials returns an agent's rows (or all rows when agent_name
  // is empty) — metadata only.
  rpc ListAgentCredentials(ListAgentCredentialsRequest) returns (ListAgentCredentialsResponse);
  // RenewAgentCredential EXTENDS a row's deadline to now + TTL without touching
  // the JWT (the same token keeps working — structural no-break). Self-service
  // (the agent presenting its own valid credential) is authorized at the API
  // tier (F-30.2's endpoint guard); this RPC simply performs the extension.
  rpc RenewAgentCredential(RenewAgentCredentialRequest) returns (cdrom.db.v1.AgentCredential);
  // RotateAgentCredential RETIRES a row (chaining replaced_by_id) and signs a
  // SUCCESSOR for the same agent; the new JWT is returned once.
  rpc RotateAgentCredential(RotateAgentCredentialRequest) returns (IssueAgentCredentialResponse);
  // RevokeAgentCredential stamps a row revoked NOW, with a reason.
  rpc RevokeAgentCredential(RevokeAgentCredentialRequest) returns (cdrom.db.v1.AgentCredential);

  // CreateServiceAccount creates a service account (F-26) and its two freshly
  // generated key slots, and binds its roles. The IdP generates each key's
  // plaintext (`cdrom-sa-…`), encodes it with Argon2ID (the pepper prepended
  // to the KDF input; the salt is embedded in the encoding), and persists the
  // encodings through the Database service. The response returns both
  // plaintext keys exactly once. The RPC is Unimplemented when no
  // service-account store is attached.
  rpc CreateServiceAccount(CreateServiceAccountRequest) returns (CreateServiceAccountResponse);
  // GetServiceAccount returns an account's metadata and both slots' non-secret
  // metadata (never the plaintext or hash) by id or login name. A missing
  // account is NotFound.
  rpc GetServiceAccount(GetServiceAccountRequest) returns (cdrom.db.v1.ServiceAccount);
  // ListServiceAccounts returns service accounts. When include_deleted is
  // false (the default) deleted accounts are excluded.
  rpc ListServiceAccounts(ListServiceAccountsRequest) returns (ListServiceAccountsResponse);
  // UpdateServiceAccount edits an account's display name/description (never
  // its roles, status, or keys). A stale revision is Aborted.
  rpc UpdateServiceAccount(UpdateServiceAccountRequest) returns (cdrom.db.v1.ServiceAccount);
  // RotateServiceAccountKey generates a brand-new `cdrom-sa-…` secret for the
  // selected slot (hashing it, mixing in the request's pepper), returns it
  // exactly once (in the response's plaintext field), and invalidates the
  // previous one. A stale revision is Aborted.
  rpc RotateServiceAccountKey(RotateServiceAccountKeyRequest) returns (RotateServiceAccountKeyResponse);
  // DisableServiceAccount temporarily disables an account (rejecting both
  // keys). A stale revision is Aborted.
  rpc DisableServiceAccount(ServiceAccountStateRequest) returns (cdrom.db.v1.ServiceAccount);
  // EnableServiceAccount re-enables a disabled, non-deleted account (restoring
  // both keys). A stale revision is Aborted.
  rpc EnableServiceAccount(ServiceAccountStateRequest) returns (cdrom.db.v1.ServiceAccount);
  // DeleteServiceAccount permanently soft-deletes an account (tombstone +
  // zeroed key slots). Repeated delete is idempotent.
  rpc DeleteServiceAccount(DeleteServiceAccountRequest) returns (cdrom.db.v1.ServiceAccount);
  // AssignServiceAccountRoles adds role bindings to an account (validated
  // against the role catalog).
  rpc AssignServiceAccountRoles(AssignServiceAccountRolesRequest) returns (cdrom.db.v1.ServiceAccount);
  // RemoveServiceAccountRole removes a role binding from an account.
  rpc RemoveServiceAccountRole(RemoveServiceAccountRoleRequest) returns (cdrom.db.v1.ServiceAccount);
  // VerifyServiceAccountKey checks a presented `login-name:cdrom-sa-…`
  // credential against the account's two key slots (salted hash, disabled,
  // and deleted state). On a miss it increments the account's failure counter
  // and locks the account out at the configured maximum. A miss is
  // Unauthenticated.
  rpc VerifyServiceAccountKey(VerifyServiceAccountKeyRequest) returns (VerifyServiceAccountKeyResponse);
  // ResetServiceAccountLockout clears an account's key lockout state (the
  // failed counter and the lockout instant). A missing account is NotFound.
  rpc ResetServiceAccountLockout(ResetServiceAccountLockoutRequest) returns (ResetServiceAccountLockoutResponse);

  // DeriveScimKey (F-28.2) draws a fresh SCIM connector key — 32 characters
  // from the documented alphabet (crypto/rand) — and computes its Argon2ID
  // encoding with the IdP's configured SCIM pepper (prepended to the KDF
  // input; the salt is drawn and embedded by the KDF). It RETURNS the
  // plaintext exactly once together with the encoding and the 8-char prefix;
  // the caller (the API, a thin proxy) persists the (encoding, prefix) pair
  // through the Database service and shows the plaintext to the operator in
  // the 201. Nothing is stored here: this is a pure derivation, so the RPC is
  // available even before any pool rows exist (the bootstrap ritual).
  rpc DeriveScimKey(DeriveScimKeyRequest) returns (DeriveScimKeyResponse);

  // AdmitPrincipal (F-28.4 Slice 3) ADJUDICATES a presented principal against
  // the user directory — the consolidated admission gate the API's auth
  // middleware invokes PER REQUEST (no caching) for every human user
  // principal (OIDC tokens and user API keys; service accounts and job tokens
  // are exempt). Judgment is ORIGIN-INDEPENDENT: the gate weighs the claims
  // presented, not who signed them (the built-in IdP issues user tokens only
  // for valid credentials, so the gate chiefly adjudicates foreign-issued
  // tokens). Modes (mutually exclusive, chosen by idp.scim.enabled):
  //   - KNOWN + ACTIVE ⇒ ADMITTED (locally-registered and SCIM-managed rows
  //     alike — admitted untouched; no overwrite).
  //   - DEACTIVATED / TOMBSTONED ⇒ DENIED with the distinct verdicts.
  //   - UNKNOWN + SCIM ENABLED ⇒ DENIED (no JIT; the corporate directory is
  //     the sole source of truth).
  //   - UNKNOWN + SCIM DISABLED ⇒ JUST-IN-TIME CREATION: a row is created
  //     (provisioned=true, external_id="", name/email from the args, roles =
  //     the CLAIM-DERIVED set — REQUIRED NON-EMPTY; empty roles ⇒ DENIED with
  //     NO row created, fail-closed) and the verdict is ADMITTED. Returning
  //     JIT users REFRESH name/email from the args and GROW roles
  //     MONOTONICALLY (stored ∪ incoming).
  // The subject is TRUSTED AS-IS (trusted-issuer ruling, 2026-11-05): no
  // charset/shape bounds — subjects arrive from the configured issuers the
  // operator elected to honor (Azure UPNs carry "@", emails-as-usernames are
  // common; the directory treats usernames as opaque unique keys). Only an
  // empty-after-trim subject is refused (InvalidArgument, not a verdict).
  rpc AdmitPrincipal(AdmitPrincipalRequest) returns (AdmitPrincipalResponse);

  // DescribeSystem (F-28.4 Slice 4) reports the IdP's OWN enablement flags —
  // a strictly non-secret whitelist feeding the API's GET /api/system/info
  // aggregator (which drives the UI's show/hide decisions). It reveals
  // capability, never material: no addresses, keys, peppers, or DSNs.
  rpc DescribeSystem(DescribeSystemRequest) returns (DescribeSystemResponse);

  // ListGroupDetails (F-28.5 Slice 4) returns the ENRICHED group documents
  // powering the API's read-only GET /api/groups admin surface. Enrichment:
  // resolved members (value + username|null, best-effort live resolution)
  // and derived_roles (the group's mapped role, catalog-checked projection).
  // READ-ONLY by design — group mutation is SCIM-owned (the corporate
  // connector speaks to /scim/v2 directly). Unimplemented when the group
  // surface is not attached.
  rpc ListGroupDetails(ListGroupDetailsRequest) returns (ListGroupDetailsResponse);
  // GetGroupDetails returns ONE enriched group document by id. A missing
  // group is NotFound; a malformed id is InvalidArgument.
  rpc GetGroupDetails(GetGroupDetailsRequest) returns (GroupDetail);
}

// MintJobTokenRequest is the request to mint a job token.
message MintJobTokenRequest {
  // job_id is the job the token is scoped to (required).
  string job_id = 1;
  // pipeline_id is the job's pipeline (0 when the job is not part of one).
  int64 pipeline_id = 2;
  // target_group is the group the job targets (empty for a single target).
  string target_group = 3;
  // audience is the audience to stamp on the token; empty makes the IdP use
  // its default job-token audiences.
  string audience = 4;
  // trigger_name / trigger_type identify the trigger that started the run
  // (F-09); empty when the run was not trigger-fired.
  string trigger_name = 5;
  string trigger_type = 6;
  // upstream_claims is the JSON-encoded set of upstream OIDC claims a webhook
  // caller presented (F-09); each is stamped onto the token prefixed with
  // "upstream_". Empty when there are none.
  string upstream_claims = 7;
  // expires_in is the token's lifetime (a duration string, e.g. "24h"); empty
  // makes the IdP use its configured token lifetime.
  string expires_in = 8;
  // issuer is the OIDC issuer to stamp on the token (the caller's configured
  // issuer, so the token verifies against the caller's discovery document).
  // Empty makes the IdP use its own configured issuer.
  string issuer = 9;
}

// MintJobTokenResponse is the minted job token.
message MintJobTokenResponse {
  // access_token is the signed job token (a JWT).
  string access_token = 1;
  // token_type is the token's type ("Bearer").
  string token_type = 2;
  // expires_in is the token's lifetime in seconds.
  int64 expires_in = 3;
}

// LoginRequest is the request to sign in with a username and password.
message LoginRequest {
  // username is the user's unique login identifier (the anchor; F-28.4).
  string username = 1;
  string password = 2;
  // audience is the audience to stamp on the minted token (the caller's
  // verifier audience, e.g. its client_id or token_audience); empty makes the
  // IdP use its default audience.
  string audience = 3;
  // issuer is the OIDC issuer to stamp on the token (the caller's configured
  // issuer, so the token verifies against the caller's discovery document).
  string issuer = 4;
}

// LoginResponse is the result of a successful login: the OIDC token the IdP
// minted for the user (present it as `Authorization: Bearer <access_token>`),
// plus the user's profile and roles.
message LoginResponse {
  string access_token = 1;
  string token_type = 2;
  int64 expires_in = 3;
  string id_token = 4;
  // user is the signed-in user's profile (never the password hash).
  cdrom.db.v1.IDPUser user = 5;
  // channel is WHICH credential satisfied the login (F-28.4 Slice 4):
  // "standing" (the user's permanent password) or "temporal" (a break-glass
  // password inside its validity window). Lets the API's local-login switch
  // admit only temporal sign-ins while refusing standing ones.
  string channel = 6;
}

// RegisterRequest is the request to create a user: the required profile
// fields (username, first/last) and password, plus an optional email and
// initial role set.
message RegisterRequest {
  string first_name = 1;
  string last_name = 2;
  string password = 4;
  repeated string roles = 5;
  // username is the user's unique login identifier (REQUIRED; F-28.4).
  string username = 6;
  // email is the user's OPTIONAL electronic-mail address (informational;
  // never a lookup key).
  string email = 7;
}

// ListUsersRequest is the request to list registered users. When
// include_deleted is true, tombstoned (deprovisioned) users are included
// (flagged via deleted_at); by default they are excluded (F-28.3).
// generic_filter narrows the result set SERVER-SIDE (equality predicates,
// AND-ed; forwarded to the Database service's pushdown) so callers pay for
// the answer, not the population.
message ListUsersRequest {
  bool include_deleted = 1;
  // Generic EQUALITY filter (attribute, case_insensitive, value): attribute
  // is one of userName, externalId, email, firstName, lastName, active,
  // provisioned; case_insensitive loosens the string comparisons (booleans
  // compare literally regardless); value is the compared constant.
  message FilterPredicate {
    string attribute = 1;
    bool case_insensitive = 2;
    string value = 3;
  }
  repeated FilterPredicate generic_filter = 2;
}

// ListUsersResponse is the set of registered users.
message ListUsersResponse {
  repeated cdrom.db.v1.IDPUser users = 1;
}

// CreateUserRequest is the request to create a user (profile, password, and
// roles).
message CreateUserRequest {
  string first_name = 1;
  string last_name = 2;
  string password = 4;
  repeated string roles = 5;
  // username is the user's unique login identifier (REQUIRED; F-28.4).
  string username = 6;
  // email is the user's OPTIONAL electronic-mail address (informational;
  // never a lookup key).
  string email = 7;
}

// UpdateUserRequest is the request to update a user's profile and/or roles.
// Empty fields are left unchanged; an empty password leaves the existing
// password untouched.
message UpdateUserRequest {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string password = 5;
  repeated string roles = 6;
  // username is the user's unique login identifier (mutable; F-28.4).
  string username = 7;
}

// DeleteUserRequest is the request to remove a user by ID.
message DeleteUserRequest {
  string id = 1;
}

// DeleteUserResponse is the result of removing a user.
message DeleteUserResponse {
  string status = 1;
}

// ---------------------------------------------------------------------------
// API keys (F-25)
// ---------------------------------------------------------------------------

// CreateAPIKeyRequest is the request to create an API key for a user. The
// owner is identified by USERNAME (the user's unique login identifier); the
// key is generated by the IdP (a `cdrom-…` secret) and its plaintext is
// returned exactly once in the response.
message CreateAPIKeyRequest {
  // owner_username is the user the key belongs to (their username).
  string owner_username = 1;
  // description is a human-readable label for the key.
  string description = 2;
  // expires_in is the key's lifetime (a duration string, e.g. "24h"); empty
  // means the key never expires. It is validated to be at most one year in
  // the future.
  string expires_in = 3;
  // pipeline_scope is the set of pipeline IDs the key is limited to; an empty
  // set means the key is not limited (it can act on any pipeline the owner
  // can).
  repeated int64 pipeline_scope = 4;
  // pepper is the secret the caller PREPENDS to the KDF input of the key's
  // Argon2ID encoding; empty encodes the key on its own. The caller (the API)
  // supplies it from its auth.api_key config so the IdP encodes keys
  // consistently.
  string pepper = 5;
}

// CreateAPIKeyResponse is the result of creating an API key: the key's
// metadata (never the hash) plus the plaintext key, returned exactly once.
message CreateAPIKeyResponse {
  // key is the key's metadata (never the hash).
  cdrom.db.v1.IDPAPIKey key = 1;
  // plaintext is the plaintext `cdrom-…` key; it is shown to the user exactly
  // once (at creation and at each rotation) and is never returned again.
  string plaintext = 2;
}

message GetAPIKeyRequest {
  // id is the key's identifier.
  string id = 1;
}

// ListAPIKeysRequest lists API keys. When owner_id is set only that user's
// keys are returned; when empty, all keys in the system are returned (an
// admin listing every key).
message ListAPIKeysRequest {
  string owner_id = 1;
}

message ListAPIKeysResponse {
  repeated cdrom.db.v1.IDPAPIKey keys = 1;
}

// UpdateAPIKeyRequest edits a key's description, expiration, and/or pipeline
// scope without changing its secret (a "renew"). The has_* flags indicate
// which fields are applied (a field whose has_* flag is false is left
// unchanged).
message UpdateAPIKeyRequest {
  // id is the key's identifier.
  string id = 1;
  // description is the new description.
  string description = 2;
  // expires_in is the new lifetime (a duration string); empty means the key
  // never expires.
  string expires_in = 3;
  // pipeline_scope is the new pipeline scope; an empty set means the key is
  // not limited (all pipelines).
  repeated int64 pipeline_scope = 4;
  // has_description indicates whether description should be applied (true) or
  // left unchanged (false).
  bool has_description = 5;
  // has_expires_at indicates whether expires_in should be applied (true) or
  // left unchanged (false).
  bool has_expires_at = 6;
  // has_pipeline_scope indicates whether pipeline_scope should be applied
  // (true) or left unchanged (false).
  bool has_pipeline_scope = 7;
}

message RotateAPIKeyRequest {
  // id is the key's identifier.
  string id = 1;
  // pepper is the secret the caller PREPENDS to the KDF input of the new
  // key's Argon2ID encoding; empty encodes the key on its own.
  string pepper = 2;
}

// RotateAPIKeyResponse is the result of rotating a key: the key's metadata
// (never the hash) plus the new plaintext key, returned exactly once.
message RotateAPIKeyResponse {
  // key is the key's metadata (never the hash).
  cdrom.db.v1.IDPAPIKey key = 1;
  // plaintext is the new plaintext `cdrom-…` key; it is shown to the user
  // exactly once and the previous key stops working.
  string plaintext = 2;
}

message DeleteAPIKeyRequest {
  // id is the key's identifier.
  string id = 1;
}

message DeleteAPIKeyResponse {
  string status = 1;
}

// VerifyAPIKeyRequest is a presented `username:apikey` credential to check
// against the stored key directory. The caller (the API) supplies the pepper
// (mixed into the key's hash) and the lockout policy (max_failures and
// lockout_duration) from its auth.api_key config.
message VerifyAPIKeyRequest {
  // username is the owner's username (the user's unique login identifier).
  string username = 1;
  // api_key is the presented key's plaintext (the `cdrom-…` value).
  string api_key = 2;
  // pepper is the secret PREPENDED to the KDF input of the key's Argon2ID
  // encoding; empty encodes the key on its own.
  string pepper = 3;
  // max_failures is the failure count that triggers a lockout; 0 disables the
  // lockout (failed attempts are counted but never lock a user out).
  int32 max_failures = 4;
  // lockout_duration is how long a lockout lasts; 0 means the lockout is
  // permanent (until an admin resets it).
  google.protobuf.Duration lockout_duration = 5;
}

// VerifyAPIKeyResponse is the result of a successful API-key verification:
// the key that matched (metadata + prefix, never the plaintext or hash) and
// the owner's profile (so the caller can establish the authenticated user
// with the owner's roles).
message VerifyAPIKeyResponse {
  cdrom.db.v1.IDPAPIKey key = 1;
  cdrom.db.v1.IDPUser owner = 2;
}

message ResetAPIKeyLockoutRequest {
  // user_id is the user's identifier.
  string user_id = 1;
}

message ResetAPIKeyLockoutResponse {
  string status = 1;
}

// ---------------------------------------------------------------------------
// Service accounts (F-26)
// ---------------------------------------------------------------------------

// CreateServiceAccountRequest is the request to create a service account and
// its two key slots. The IdP generates both keys' plaintexts (each a
// `cdrom-sa-…` secret), hashes them (mixing in a per-key salt and the
// request's pepper), and persists the salted hashes through the Database
// service. The response returns both plaintext keys exactly once.
message CreateServiceAccountRequest {
  // login_name is the account's unique, immutable login identifier.
  string login_name = 1;
  // display_name is a human-readable name for the account.
  string display_name = 2;
  // description is a human-readable description of the account.
  string description = 3;
  // roles are the role names to bind to the account at creation.
  repeated string roles = 4;
  // pepper is the secret the caller mixes into each key's hash (alongside the
  // per-key salt); empty hashes the key with its salt alone. The caller (the
  // API) supplies it from its auth.service_account config so the IdP hashes
  // keys consistently.
  string pepper = 5;
  // created_by is the identity of the principal creating the account.
  string created_by = 6;
}

// CreateServiceAccountResponse is the result of creating a service account:
// the account's metadata (never the hashes) plus both plaintext keys,
// returned exactly once.
message CreateServiceAccountResponse {
  // account is the created account's metadata (with its two slots' non-secret
  // metadata).
  cdrom.db.v1.ServiceAccount account = 1;
  // keys are the two plaintext keys, one per slot (shown to the caller exactly
  // once, at creation).
  repeated ServiceAccountPlaintextKey keys = 2;
}

// ServiceAccountPlaintextKey is a slot number and its plaintext key (returned
// exactly once at creation or rotation).
message ServiceAccountPlaintextKey {
  // slot is the key's slot number (1 or 2).
  int32 slot = 1;
  // key is the plaintext `cdrom-sa-…` key.
  string key = 2;
}

message GetServiceAccountRequest {
  // id is the account's identifier; when empty, login_name is used.
  string id = 1;
  // login_name is the account's login identifier (used when id is empty).
  string login_name = 2;
  // include_deleted, when true, returns a deleted (tombstoned) account.
  bool include_deleted = 3;
}

message ListServiceAccountsRequest {
  // include_deleted, when true, includes deleted (tombstoned) accounts.
  bool include_deleted = 1;
}

message ListServiceAccountsResponse {
  repeated cdrom.db.v1.ServiceAccount accounts = 1;
}

// UpdateServiceAccountRequest edits an account's display name/description.
// The has_* flags indicate which fields are applied (a field whose flag is
// false is left unchanged). revision is the concurrency guard (a stale
// revision is Aborted).
message UpdateServiceAccountRequest {
  // id is the account's identifier.
  string id = 1;
  // display_name is the new display name.
  string display_name = 2;
  // description is the new description.
  string description = 3;
  // has_display_name indicates whether display_name should be applied (true)
  // or left unchanged (false).
  bool has_display_name = 4;
  // has_description indicates whether description should be applied (true) or
  // left unchanged (false).
  bool has_description = 5;
  // revision is the account's revision the caller last saw; a mismatch is
  // Aborted (a concurrent mutation).
  int64 revision = 6;
  // updated_by is the identity of the principal making the change.
  string updated_by = 7;
}

// RotateServiceAccountKeyRequest rotates one of an account's key slots. The
// IdP generates the new key's plaintext, hashes it (mixing in the request's
// pepper and a fresh per-key salt), and persists it; the response returns the
// new plaintext exactly once.
message RotateServiceAccountKeyRequest {
  // id is the account's identifier.
  string id = 1;
  // slot is the slot to rotate (1 or 2).
  int32 slot = 2;
  // pepper is the secret mixed into the new key's hash (alongside the per-key
  // salt); empty hashes the key with its salt alone.
  string pepper = 3;
  // revision is the account's revision the caller last saw; a mismatch is
  // Aborted (a concurrent mutation).
  int64 revision = 4;
  // updated_by is the identity of the principal making the change.
  string updated_by = 5;
}

// RotateServiceAccountKeyResponse is the result of rotating a slot: the
// account's metadata (never the hash) plus the new plaintext key, returned
// exactly once.
message RotateServiceAccountKeyResponse {
  // account is the account's metadata (with its two slots' non-secret
  // metadata).
  cdrom.db.v1.ServiceAccount account = 1;
  // key is the new plaintext `cdrom-sa-…` key for the rotated slot (shown to
  // the caller exactly once); the previous key stops working.
  ServiceAccountPlaintextKey key = 2;
}

// ServiceAccountStateRequest is the request to disable or enable an account.
message ServiceAccountStateRequest {
  // id is the account's identifier.
  string id = 1;
  // revision is the account's revision the caller last saw; a mismatch is
  // Aborted (a concurrent mutation).
  int64 revision = 2;
  // updated_by is the identity of the principal making the change.
  string updated_by = 3;
}

// DeleteServiceAccountRequest permanently soft-deletes an account.
message DeleteServiceAccountRequest {
  // id is the account's identifier.
  string id = 1;
  // updated_by is the identity of the principal making the change.
  string updated_by = 2;
}

// AssignServiceAccountRolesRequest adds role bindings to an account.
message AssignServiceAccountRolesRequest {
  // id is the account's identifier.
  string id = 1;
  // roles are the role names to bind to the account.
  repeated string roles = 2;
  // updated_by is the identity of the principal making the change.
  string updated_by = 3;
}

// RemoveServiceAccountRoleRequest removes a role binding from an account.
message RemoveServiceAccountRoleRequest {
  // id is the account's identifier.
  string id = 1;
  // role is the name of the role to remove.
  string role = 2;
  // updated_by is the identity of the principal making the change.
  string updated_by = 3;
}

// VerifyServiceAccountKeyRequest is a presented `login-name:cdrom-sa-…`
// credential to check against the account's two key slots. The caller (the
// API) supplies the pepper (mixed into each key's salted hash) and the lockout
// policy (max_failures and lockout_duration) from its auth.service_account
// config.
message VerifyServiceAccountKeyRequest {
  // login_name is the account's login identifier.
  string login_name = 1;
  // api_key is the presented key's plaintext (the `cdrom-sa-…` value).
  string api_key = 2;
  // pepper is the secret mixed into each key's salted hash; empty hashes the
  // key with its salt alone.
  string pepper = 3;
  // max_failures is the failure count that triggers a lockout; 0 disables the
  // lockout (failed attempts are counted but never lock the account out).
  int32 max_failures = 4;
  // lockout_duration is how long a lockout lasts; 0 means the lockout is
  // permanent (until an admin resets it).
  google.protobuf.Duration lockout_duration = 5;
}

// VerifyServiceAccountKeyResponse is the result of a successful service-
// account key verification: the account (with its roles) so the caller can
// establish the authenticated service-account principal.
message VerifyServiceAccountKeyResponse {
  cdrom.db.v1.ServiceAccount account = 1;
  // slot is the key slot that matched (1 or 2).
  int32 slot = 2;
}

message ResetServiceAccountLockoutRequest {
  // id is the account's identifier.
  string id = 1;
}

message ResetServiceAccountLockoutResponse {
  string status = 1;
}

// ---------------------------------------------------------------------------
// SCIM keys (F-28.2)
// ---------------------------------------------------------------------------

// DeriveScimKeyRequest asks the IdP to draw a fresh SCIM connector key and
// compute its Argon2ID encoding. The IdP is the ONLY pepper-touching site:
// the pepper comes from ITS config (CDROM_IDP_SCIM_KEYS_PEPPER) and is never
// transmitted; the response carries the plaintext (shown exactly once), the
// encoding (persisted by the caller), and the prefix (listing aid).
message DeriveScimKeyRequest {}

// DeriveScimKeyResponse is the result of a derivation: the plaintext key
// (exactly once), its Argon2ID encoding, and its 8-character prefix.
message DeriveScimKeyResponse {
  // key is the plaintext 32-character secret (shown to the operator exactly
  // once, at creation).
  string key = 1;
  // encoding is the Argon2ID PHC encoding of pepper‖key (salt + parameters
  // embedded). This is what the caller persists; the plaintext is discarded.
  string encoding = 2;
  // prefix is the first eight characters of the plaintext (display aid).
  string prefix = 3;
}

// ---------------------------------------------------------------------------
// Admission gate (F-28.4 Slice 3)
// ---------------------------------------------------------------------------

// AdmissionVerdict is the gate's determination for a presented principal.
enum AdmissionVerdict {
  // ADMITTED_UNSPECIFIED is the zero value (no verdict).
  ADMITTED_UNSPECIFIED = 0;
  // ADMITTED: the principal is known + active (or was just-created via JIT).
  ADMITTED = 1;
  // DEACTIVATED: the row exists but active=false (denied; "on leave").
  DEACTIVATED = 2;
  // DEPROVISIONED: the row is tombstoned (denied; departed).
  DEPROVISIONED = 3;
  // UNKNOWN_REJECTED: no row exists and JIT is unavailable — SCIM is
  // enabled (the corporate directory is the sole source of truth; denied,
  // no row created).
  UNKNOWN_REJECTED = 4;
  // NO_ROLES_REJECTED: JIT would apply but the claim-derived role set is
  // EMPTY (denied; no row created — fail-closed).
  NO_ROLES_REJECTED = 5;
}

// AdmitPrincipalRequest presents a principal's identity for adjudication.
// The fields mirror what the API's auth middleware extracts from a verified
// token (or an API-key credential): the username (the subject claim), the
// display name, the email, and the CLAIM-DERIVED role set.
message AdmitPrincipalRequest {
  // username is the principal's login identifier (the token's subject claim,
  // or the API-key owner). REQUIRED. Trusted as presented (trusted-issuer
  // ruling): no charset/shape bounds — the directory treats usernames as
  // opaque unique keys. Only an empty-after-trim value is refused
  // (InvalidArgument, not a verdict).
  string username = 1;
  // name is the display name (OPTIONAL; refreshed onto JIT rows).
  string name = 2;
  // email is the principal's email (OPTIONAL; refreshed onto JIT rows).
  string email = 3;
  // roles is the CLAIM-DERIVED role set (REQUIRED NON-EMPTY for JIT creation;
  // ignored for known users — their roles are operator-/SCIM-controlled).
  repeated string roles = 4;
}

// AdmitPrincipalResponse carries the verdict and (when admitted) the
// AUTHORITATIVE user profile — the caller adopts the row's roles/state, not
// the presented ones, so a JIT user's monotonic role growth and a known
// user's operator grants are reflected faithfully.
message AdmitPrincipalResponse {
  // verdict is the gate's determination.
  AdmissionVerdict verdict = 1;
  // user is the admitted row's profile (set only when verdict=ADMITTED);
  // nil otherwise. Its roles reflect the EFFECTIVE set (monotonic growth for
  // JIT, stored set for known users).
  cdrom.db.v1.IDPUser user = 2;
}

// ---------------------------------------------------------------------------
// System description (F-28.4 Slice 4)
// ---------------------------------------------------------------------------

// DescribeSystemRequest is empty: the IdP describes ITSELF.
message DescribeSystemRequest {}

// DescribeSystemResponse is the IdP's OWN enablement flags — a strictly
// non-secret whitelist consumed by the API's GET /api/system/info aggregator
// (which drives the UI's show/hide decisions). Capability only: no
// addresses, keys, peppers, or DSNs ever travel here.
message DescribeSystemResponse {
  // scim_enabled reports whether the SCIM 2.0 user-provisioning surface
  // (F-28.1) is mounted.
  bool scim_enabled = 1;
  // local_login_enabled reports whether username/password sign-in is
  // permitted (F-28.4 Slice 4). When false the IdP admits only TEMPORAL
  // (break-glass) logins and refuses registration.
  bool local_login_enabled = 2;
  // break_glass_enabled reports whether the break-glass escape hatch
  // (F-28.3) is armed.
  bool break_glass_enabled = 3;
}

// ---------------------------------------------------------------------------
// Group details (F-28.5 Slice 4) — the enriched documents behind the API's
// read-only /api/groups admin surface. Stable field names, no secrets.
// ---------------------------------------------------------------------------

// GroupDetail is one ENRICHED group document: the stored attributes plus the
// resolved membership and the group's projected derived role. Timestamps are
// RFC3339 strings (matching this proto's flat-string convention).
message GroupDetail {
  // id is the group's stable identifier (decimal string — the SCIM id).
  string id = 1;
  string display_name = 2;
  string description = 3;
  // external_id is the corporate directory's group identifier (empty when
  // the provider sent none). Shown for identification; never mutated here.
  string external_id = 4;
  // member_values are the group's VERBATIM membership strings (opaque).
  repeated string member_values = 5;
  // members are the RESOLVED membership projections: each stored value with
  // the LIVE username it denotes (null when unresolvable — the value is
  // kept, per the opacity ruling). Ordered to match member_values.
  repeated ResolvedGroupMember members = 6;
  // derived_roles is the group's PROJECTED role set: the mapped role for
  // this displayName, present ONLY when it exists in the role catalog
  // (missing mapped roles are excluded — they are skipped at application
  // time, ruling 4). Typically 0 or 1 entry (the mapping is one role per
  // group); empty for unmapped groups.
  repeated string derived_roles = 7;
  string created_at = 8;
  string updated_at = 9;
}

// ResolvedGroupMember pairs a stored membership value with the live user it
// resolves to (username; null when the value denotes no live user).
message ResolvedGroupMember {
  // value is the stored verbatim membership string.
  string value = 1;
  // username is the resolved LIVE user's login name; null when the value
  // is unresolvable (departed/unknown member — kept, degraded).
  optional string username = 2;
}

// ListGroupDetailsRequest lists enriched groups (ordered by id).
message ListGroupDetailsRequest {}

// ListGroupDetailsResponse carries the enriched group documents.
message ListGroupDetailsResponse {
  repeated GroupDetail groups = 1;
}

// GetGroupDetailsRequest fetches one enriched group by id.
message GetGroupDetailsRequest {
  string id = 1;
}

// ---------------------------------------------------------------------------
// Agent credentials (F-30.2). The IdP signs the JWTs and drives their
// lifecycle in the Database service's credential directory. The plaintext JWT
// is returned EXACTLY ONCE (issue / rotate) and is never retrievable
// afterwards; every other response carries row METADATA only.

// IssueAgentCredentialRequest asks the IdP to sign a new credential for the
// named agent. Deadline = now + the configured TTL.
message IssueAgentCredentialRequest {
  // agent_name is the agent the credential binds to (the JWT's subject is
  // "agent:<agent_name>"; registration may only claim this name).
  string agent_name = 1;
  // issued_by is the acting principal (audit link).
  string issued_by = 2;
  // description is a human-readable label.
  string description = 3;
}

// IssueAgentCredentialResponse carries the stored row PLUS the plaintext JWT
// (shown exactly once).
message IssueAgentCredentialResponse {
  cdrom.db.v1.AgentCredential credential = 1;
  // jwt is the signed credential token. Returned only by issue and rotate.
  string jwt = 2;
}

// GetAgentCredentialRequest looks a row up by id (metadata only).
message GetAgentCredentialRequest {
  string id = 1;
}

// ListAgentCredentialsRequest lists rows for one agent ("" = all agents).
message ListAgentCredentialsRequest {
  string agent_name = 1;
}

// ListAgentCredentialsResponse carries the rows (metadata only).
message ListAgentCredentialsResponse {
  repeated cdrom.db.v1.AgentCredential credentials = 1;
}

// RenewAgentCredentialRequest extends a row's deadline to now + TTL WITHOUT
// touching the JWT (the same token keeps working).
message RenewAgentCredentialRequest {
  string id = 1;
}

// RotateAgentCredentialRequest retires a row and signs a successor for the
// same agent. The new JWT is returned once.
message RotateAgentCredentialRequest {
  // id is the credential being retired.
  string id = 1;
  // issued_by is the acting principal (recorded on the successor).
  string issued_by = 2;
  // description is the successor's label (falls back to the retired row's
  // when empty).
  string description = 3;
}

// RevokeAgentCredentialRequest stamps a row revoked now, with a reason.
message RevokeAgentCredentialRequest {
  string id = 1;
  string reason = 2;
}
