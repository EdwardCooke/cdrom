syntax = "proto3";

package cdrom.idp.v1;

import "cdrom/db/v1/db.proto";
import "google/protobuf/duration.proto";

option go_package = "cdrom/internal/gen/cdrom/idp/v1;idpv1";

// IdP is the gRPC surface of the local OIDC identity provider. It carries the
// IdP's API-only operations: minting job tokens and managing the user
// directory (username/password authentication). The API is the sole caller and
// authenticates to the IdP with its mTLS client certificate (when TLS is
// configured), so only a CA-signed client (the API) can mint job tokens or
// manage users.
//
// The standard OIDC surface (discovery, JWKS, the authorization endpoint, and
// the authorization_code token grant) is served over HTTP, because it is a
// browser-based protocol (redirects) that cannot be expressed as gRPC.
service IdP {
  // MintJobToken mints a job token for a dispatched job. The API is the only
  // caller; it authenticates with its mTLS client certificate. The token is
  // scoped to the job (job_id, pipeline_id, target_group) and to the API plus
  // any outside resources a job may call (audience). An empty audience makes
  // the IdP use its default job-token audiences. The token's lifetime is
  // expires_in when set, else the IdP's configured token lifetime.
  rpc MintJobToken(MintJobTokenRequest) returns (MintJobTokenResponse);

  // Login verifies a user's credentials (email + password) and returns the
  // OIDC token the IdP minted for the user (stamped with the user's roles)
  // plus the user's profile. A bad password or unknown user is
  // Unauthenticated.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Register creates a new user from the request's profile and password. The
  // password is hashed before it is stored. A duplicate email is
  // AlreadyExists.
  rpc Register(RegisterRequest) returns (cdrom.db.v1.IDPUser);
  // ListUsers returns all registered users (profile + roles, no password).
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // CreateUser creates a user (profile, password, and roles). A duplicate
  // email is AlreadyExists.
  rpc CreateUser(CreateUserRequest) returns (cdrom.db.v1.IDPUser);
  // UpdateUser updates a user's profile and/or roles (and password when
  // supplied), keyed by user ID. A missing user is NotFound.
  rpc UpdateUser(UpdateUserRequest) returns (cdrom.db.v1.IDPUser);
  // DeleteUser removes a user by ID. A missing user is NotFound.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // CreateAPIKey generates a new `cdrom-…` API key for a user, hashes it,
  // stores it, and returns the plaintext exactly once (in the response's
  // key field). The key's metadata (description, expiration, pipeline scope)
  // is set from the request. A key's expiration is validated to be at most
  // one year in the future. The RPC is Unimplemented when no user store is
  // attached.
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);
  // GetAPIKey returns a key's metadata and prefix (never the plaintext or
  // hash) by key id. A missing key is NotFound.
  rpc GetAPIKey(GetAPIKeyRequest) returns (cdrom.db.v1.IDPAPIKey);
  // ListAPIKeys returns API keys. When owner_id is set only that user's keys
  // are returned; when empty, all keys in the system are returned (an admin
  // listing every key). The plaintext is never returned.
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);
  // UpdateAPIKey edits a key's description, expiration, and/or pipeline scope
  // without changing its secret (a "renew"); the same `cdrom-…` value keeps
  // working. A missing key is NotFound.
  rpc UpdateAPIKey(UpdateAPIKeyRequest) returns (cdrom.db.v1.IDPAPIKey);
  // RotateAPIKey generates a brand-new `cdrom-…` secret for a key, returns it
  // exactly once (in the response's key field), and invalidates the previous
  // one. A missing key is NotFound.
  rpc RotateAPIKey(RotateAPIKeyRequest) returns (RotateAPIKeyResponse);
  // DeleteAPIKey removes a key by id. A missing key is NotFound.
  rpc DeleteAPIKey(DeleteAPIKeyRequest) returns (DeleteAPIKeyResponse);
  // VerifyAPIKey checks a presented `username:apikey` credential against the
  // stored key directory (hash, expiration, and the owner's lockout). On a
  // miss it increments the owner's failure counter and locks the owner out at
  // the configured maximum. A miss is Unauthenticated.
  rpc VerifyAPIKey(VerifyAPIKeyRequest) returns (VerifyAPIKeyResponse);
  // ResetAPIKeyLockout clears a user's API-key lockout state (the failed
  // counter and the lockout instant). A missing user is NotFound.
  rpc ResetAPIKeyLockout(ResetAPIKeyLockoutRequest) returns (ResetAPIKeyLockoutResponse);
}

// MintJobTokenRequest is the request to mint a job token.
message MintJobTokenRequest {
  // job_id is the job the token is scoped to (required).
  string job_id = 1;
  // pipeline_id is the job's pipeline (0 when the job is not part of one).
  int64 pipeline_id = 2;
  // target_group is the group the job targets (empty for a single target).
  string target_group = 3;
  // audience is the audience to stamp on the token; empty makes the IdP use
  // its default job-token audiences.
  string audience = 4;
  // trigger_name / trigger_type identify the trigger that started the run
  // (F-09); empty when the run was not trigger-fired.
  string trigger_name = 5;
  string trigger_type = 6;
  // upstream_claims is the JSON-encoded set of upstream OIDC claims a webhook
  // caller presented (F-09); each is stamped onto the token prefixed with
  // "upstream_". Empty when there are none.
  string upstream_claims = 7;
  // expires_in is the token's lifetime (a duration string, e.g. "24h"); empty
  // makes the IdP use its configured token lifetime.
  string expires_in = 8;
  // issuer is the OIDC issuer to stamp on the token (the caller's configured
  // issuer, so the token verifies against the caller's discovery document).
  // Empty makes the IdP use its own configured issuer.
  string issuer = 9;
}

// MintJobTokenResponse is the minted job token.
message MintJobTokenResponse {
  // access_token is the signed job token (a JWT).
  string access_token = 1;
  // token_type is the token's type ("Bearer").
  string token_type = 2;
  // expires_in is the token's lifetime in seconds.
  int64 expires_in = 3;
}

// LoginRequest is the request to sign in with a username and password.
message LoginRequest {
  string email = 1;
  string password = 2;
  // audience is the audience to stamp on the minted token (the caller's
  // verifier audience, e.g. its client_id or token_audience); empty makes the
  // IdP use its default audience.
  string audience = 3;
  // issuer is the OIDC issuer to stamp on the token (the caller's configured
  // issuer, so the token verifies against the caller's discovery document).
  string issuer = 4;
}

// LoginResponse is the result of a successful login: the OIDC token the IdP
// minted for the user (present it as `Authorization: Bearer <access_token>`),
// plus the user's profile and roles.
message LoginResponse {
  string access_token = 1;
  string token_type = 2;
  int64 expires_in = 3;
  string id_token = 4;
  // user is the signed-in user's profile (never the password hash).
  cdrom.db.v1.IDPUser user = 5;
}

// RegisterRequest is the request to create a user: the required profile
// fields (first/last/email) and password, plus an optional initial role set.
message RegisterRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string password = 4;
  repeated string roles = 5;
}

// ListUsersRequest is the request to list all registered users.
message ListUsersRequest {}

// ListUsersResponse is the set of registered users.
message ListUsersResponse {
  repeated cdrom.db.v1.IDPUser users = 1;
}

// CreateUserRequest is the request to create a user (profile, password, and
// roles).
message CreateUserRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string password = 4;
  repeated string roles = 5;
}

// UpdateUserRequest is the request to update a user's profile and/or roles.
// Empty fields are left unchanged; an empty password leaves the existing
// password untouched.
message UpdateUserRequest {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string password = 5;
  repeated string roles = 6;
}

// DeleteUserRequest is the request to remove a user by ID.
message DeleteUserRequest {
  string id = 1;
}

// DeleteUserResponse is the result of removing a user.
message DeleteUserResponse {
  string status = 1;
}

// ---------------------------------------------------------------------------
// API keys (F-25)
// ---------------------------------------------------------------------------

// CreateAPIKeyRequest is the request to create an API key for a user. The
// owner is identified by email (the user's unique login identifier); the key
// is generated by the IdP (a `cdrom-…` secret) and its plaintext is returned
// exactly once in the response.
message CreateAPIKeyRequest {
  // owner_email is the user the key belongs to (their email).
  string owner_email = 1;
  // description is a human-readable label for the key.
  string description = 2;
  // expires_in is the key's lifetime (a duration string, e.g. "24h"); empty
  // means the key never expires. It is validated to be at most one year in
  // the future.
  string expires_in = 3;
  // pipeline_scope is the set of pipeline IDs the key is limited to; an empty
  // set means the key is not limited (it can act on any pipeline the owner
  // can).
  repeated int64 pipeline_scope = 4;
  // pepper is the secret the caller mixes into the key's hash (SHA-512 of
  // pepper + key); empty hashes the key on its own. The caller (the API)
  // supplies it from its auth.api_key config so the IdP hashes keys
  // consistently.
  string pepper = 5;
}

// CreateAPIKeyResponse is the result of creating an API key: the key's
// metadata (never the hash) plus the plaintext key, returned exactly once.
message CreateAPIKeyResponse {
  // key is the key's metadata (never the hash).
  cdrom.db.v1.IDPAPIKey key = 1;
  // plaintext is the plaintext `cdrom-…` key; it is shown to the user exactly
  // once (at creation and at each rotation) and is never returned again.
  string plaintext = 2;
}

message GetAPIKeyRequest {
  // id is the key's identifier.
  string id = 1;
}

// ListAPIKeysRequest lists API keys. When owner_id is set only that user's
// keys are returned; when empty, all keys in the system are returned (an
// admin listing every key).
message ListAPIKeysRequest {
  string owner_id = 1;
}

message ListAPIKeysResponse {
  repeated cdrom.db.v1.IDPAPIKey keys = 1;
}

// UpdateAPIKeyRequest edits a key's description, expiration, and/or pipeline
// scope without changing its secret (a "renew"). The has_* flags indicate
// which fields are applied (a field whose has_* flag is false is left
// unchanged).
message UpdateAPIKeyRequest {
  // id is the key's identifier.
  string id = 1;
  // description is the new description.
  string description = 2;
  // expires_in is the new lifetime (a duration string); empty means the key
  // never expires.
  string expires_in = 3;
  // pipeline_scope is the new pipeline scope; an empty set means the key is
  // not limited (all pipelines).
  repeated int64 pipeline_scope = 4;
  // has_description indicates whether description should be applied (true) or
  // left unchanged (false).
  bool has_description = 5;
  // has_expires_at indicates whether expires_in should be applied (true) or
  // left unchanged (false).
  bool has_expires_at = 6;
  // has_pipeline_scope indicates whether pipeline_scope should be applied
  // (true) or left unchanged (false).
  bool has_pipeline_scope = 7;
}

message RotateAPIKeyRequest {
  // id is the key's identifier.
  string id = 1;
  // pepper is the secret the caller mixes into the new key's hash (SHA-512 of
  // pepper + key); empty hashes the key on its own.
  string pepper = 2;
}

// RotateAPIKeyResponse is the result of rotating a key: the key's metadata
// (never the hash) plus the new plaintext key, returned exactly once.
message RotateAPIKeyResponse {
  // key is the key's metadata (never the hash).
  cdrom.db.v1.IDPAPIKey key = 1;
  // plaintext is the new plaintext `cdrom-…` key; it is shown to the user
  // exactly once and the previous key stops working.
  string plaintext = 2;
}

message DeleteAPIKeyRequest {
  // id is the key's identifier.
  string id = 1;
}

message DeleteAPIKeyResponse {
  string status = 1;
}

// VerifyAPIKeyRequest is a presented `username:apikey` credential to check
// against the stored key directory. The caller (the API) supplies the pepper
// (mixed into the key's hash) and the lockout policy (max_failures and
// lockout_duration) from its auth.api_key config.
message VerifyAPIKeyRequest {
  // username is the owner's email (the user's unique login identifier).
  string username = 1;
  // api_key is the presented key's plaintext (the `cdrom-…` value).
  string api_key = 2;
  // pepper is the secret mixed into the key's hash (SHA-512 of pepper + key);
  // empty hashes the key on its own.
  string pepper = 3;
  // max_failures is the failure count that triggers a lockout; 0 disables the
  // lockout (failed attempts are counted but never lock a user out).
  int32 max_failures = 4;
  // lockout_duration is how long a lockout lasts; 0 means the lockout is
  // permanent (until an admin resets it).
  google.protobuf.Duration lockout_duration = 5;
}

// VerifyAPIKeyResponse is the result of a successful API-key verification:
// the key that matched (metadata + prefix, never the plaintext or hash) and
// the owner's profile (so the caller can establish the authenticated user
// with the owner's roles).
message VerifyAPIKeyResponse {
  cdrom.db.v1.IDPAPIKey key = 1;
  cdrom.db.v1.IDPUser owner = 2;
}

message ResetAPIKeyLockoutRequest {
  // user_id is the user's identifier.
  string user_id = 1;
}

message ResetAPIKeyLockoutResponse {
  string status = 1;
}
