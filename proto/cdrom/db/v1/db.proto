syntax = "proto3";

package cdrom.db.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "cdrom/internal/gen/cdrom/db/v1;dbv1";

// Database is the gRPC interface for all persisted pipeline data.
//
// It is the only component allowed to touch the storage backend (SQLite in
// development, PostgreSQL in deployment). Every other component — the API,
// the scheduler, workers, and agents — reads and writes data exclusively
// through this service.
service Database {
  // Pipelines
  rpc CreatePipeline(CreatePipelineRequest) returns (Pipeline);
  rpc GetPipeline(GetPipelineRequest) returns (Pipeline);
  rpc ListPipelines(ListPipelinesRequest) returns (ListPipelinesResponse);
  rpc UpdatePipeline(UpdatePipelineRequest) returns (Pipeline);
  rpc DeletePipeline(DeletePipelineRequest) returns (google.protobuf.Empty);
  // TriggerRun atomically claims a trigger-fired run (F-09): it creates a
  // PipelineRun (triggered by the named trigger of the pipeline) and one job
  // instance per job definition, exactly like CreateRun, but only if no run
  // of the pipeline started by the same trigger has already started within
  // the trigger's fire window (the window is the trigger's cron period for a
  // cron trigger, and a short debounce for webhook/event triggers). The
  // atomic claim is what keeps a trigger from firing twice for the same
  // window when the scheduler is restarted or two replicas race: the second
  // claim finds the first run and is a no-op. It returns the created run (or
  // the run that already claimed the window) and whether this call created
  // it.
  rpc TriggerRun(TriggerRunRequest) returns (TriggerRunResponse);

  // Pipeline runs (F-07). A run is one execution of a pipeline, owning a set
  // of job instances. CreateRun atomically creates the run row and one job
  // instance per job definition in the pipeline (remapping each instance's
  // depends_on from the definition ids to the new instance ids); the
  // scheduler then drives the instances. The other RPCs let the API (and the
  // UI) list and fetch runs.
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);
  rpc GetRun(GetRunRequest) returns (PipelineRun);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  // UpdateRun applies a partial update to a run: a status of
  // RUN_STATUS_UNSPECIFIED leaves the status unchanged, and nil timestamps
  // leave the corresponding field unchanged. The scheduler's run-status loop
  // uses it to persist a run's derived status and start/finish timestamps.
  rpc UpdateRun(UpdateRunRequest) returns (PipelineRun);

  // Pipeline versions (F-11). Each change to a pipeline definition produces a
  // new version; a run is bound to the version that was active when it
  // started. ListPipelineVersions returns a pipeline's version history (most
  // recent first); GetPipelineVersion returns the immutable snapshot of one
  // version (its definition: name, description, failure mode, job
  // definitions, triggers, and parameters).
  rpc ListPipelineVersions(ListPipelineVersionsRequest) returns (ListPipelineVersionsResponse);
  rpc GetPipelineVersion(GetPipelineVersionRequest) returns (PipelineVersion);

  // Jobs
  rpc CreateJob(CreateJobRequest) returns (Job);
  rpc GetJob(GetJobRequest) returns (Job);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  // ListRetriableJobs returns the jobs the scheduler's retry loop should
  // re-dispatch (F-04): jobs that are failed and still have retries remaining
  // (a retry policy with max_attempts > 0 and an attempt counter below the
  // budget). Filtering in the database keeps the retry loop from pulling every
  // failed job over the wire as the system grows.
  rpc ListRetriableJobs(ListRetriableJobsRequest) returns (ListJobsResponse);
  rpc UpdateJob(UpdateJobRequest) returns (Job);
  rpc DeleteJob(DeleteJobRequest) returns (google.protobuf.Empty);
  // ClaimJobRetry atomically claims the next retry attempt for a job: it
  // increments the job's attempt counter and resets it to pending only if the
  // job is still in a non-terminal state (pending or running) and has not
  // exhausted its retry budget. It returns the claimed attempt number (1-based)
  // and whether the claim succeeded. This is how the scheduler re-dispatches a
  // failed job (F-04): the conditional update is atomic, so a job that
  // reported a terminal status between the check and the claim is left
  // untouched, and a job that has used up its retries is never re-dispatched.
  rpc ClaimJobRetry(ClaimJobRetryRequest) returns (ClaimJobRetryResponse);
  // RerunJob resets a finished job to pending with a fresh attempt (F-04): it
  // sets the status to pending, the attempt to 1, and clears the finished
  // timestamp. Only jobs in a terminal state (succeeded, failed, cancelled,
  // or timed_out) can be re-run; a job that is still pending or running is
  // rejected. This is how the scheduler's RerunJob RPC re-runs a finished job.
  rpc RerunJob(RerunJobRequest) returns (Job);
  // ReapJob conditionally marks a job as timed_out: it sets the status to
  // TIMED_OUT (and the finished timestamp) only if the job is still in a
  // non-terminal state (pending or running). It returns whether the job was
  // reaped. This is how the scheduler's watchdog reaps a job whose target
  // went silent (F-03): a job that already reported a terminal status is
  // left untouched.
  rpc ReapJob(ReapJobRequest) returns (ReapJobResponse);
  // CancelJob conditionally marks a job as cancelled: it sets the status to
  // CANCELLED (and the finished timestamp) only if the job is still in a
  // non-terminal state (pending or running). It returns whether the job was
  // cancelled. This is how the scheduler's CancelJob RPC (F-05) persists the
  // cancellation: a job that already reported a terminal status is left
  // untouched, so cancelling a finished job is a no-op.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  // SkipJob conditionally marks a job as skipped: it sets the status to
  // SKIPPED (and the finished timestamp) only if the job is still pending
  // (has not started). It returns whether the job was skipped. This is how
  // the scheduler's dependency resolver marks a job skipped when one of its
  // dependencies did not succeed (F-06): a job that already started (or
  // finished) is left untouched, so a job can never be skipped out from
  // under a target that is already running it.
  rpc SkipJob(SkipJobRequest) returns (SkipJobResponse);
  // ClaimJob atomically claims a pending job for execution (F-23): it sets
  // the status to RUNNING (and the started timestamp) only if the job is
  // still PENDING. It returns whether the job was claimed. This is how a
  // worker (or the API on a worker's behalf) takes ownership of a job it
  // picked up via the pull path or a push nudge: the conditional update is
  // atomic, so a job delivered by both push and pull is claimed exactly once
  // and the duplicate is a no-op.
  rpc ClaimJob(ClaimJobRequest) returns (ClaimJobResponse);
  // ListPendingByGroup returns the pending jobs that target the given worker
  // group (F-23). This is the pull path: a worker (or the API on its behalf)
  // polls it to pick up jobs that were published while it was unreachable, so
  // no job is stranded pending. Filtering in the database keeps the poll from
  // pulling every pending job over the wire as the system grows.
  rpc ListPendingByGroup(ListPendingByGroupRequest) returns (ListJobsResponse);
  // StartJobExecution records that the calling worker has started running a
  // job (fan-out): it creates the worker's JobExecution for the job's current
  // attempt and marks the job running. A job that targets a worker group runs
  // on every worker in the group; each worker's run is a separate execution,
  // so the start is not exclusive (unlike the old single-claim work queue).
  // Starting an execution for a job that is no longer pending (it reached a
  // terminal state, or it is not targeted at the worker's group) is rejected.
  rpc StartJobExecution(StartJobExecutionRequest) returns (StartJobExecutionResponse);
  // ListJobExecutions returns a job's executions (one per worker that started
  // it, for its current attempt). The scheduler's job-status loop uses it to
  // derive the job's overall status from the per-worker outcomes (fan-out).
  rpc ListJobExecutions(ListJobExecutionsRequest) returns (ListJobExecutionsResponse);
  // UpdateJobExecution records a worker's outcome for its execution of a job
  // (fan-out): it sets the execution's terminal status (and finished
  // timestamp, step results, and outputs) for the worker's execution of the
  // job's current attempt. The job row's overall status is not touched here —
  // it is derived from the executions by the scheduler's job-status loop.
  rpc UpdateJobExecution(UpdateJobExecutionRequest) returns (JobExecution);
  // AbandonWorkerExecutions marks all of a worker's running executions as
  // failed (fan-out). It is called when a worker re-registers after a
  // restart: the worker's in-progress executions from before the restart are
  // abandoned (the worker will not resume them) so they do not block the job's
  // overall status.
  rpc AbandonWorkerExecutions(AbandonWorkerExecutionsRequest) returns (google.protobuf.Empty);
  // ReportStepCompletion records that a worker has completed a step of a job
  // (the cross-worker step barrier). A worker that runs a job with a step
  // barrier reports each step it finishes; the barrier for a step is satisfied
  // once every worker that is alive has reported that step. The completion is
  // recorded for the job's current attempt.
  rpc ReportStepCompletion(ReportStepCompletionRequest) returns (google.protobuf.Empty);
  // CheckStepBarrier reports whether the barrier for a job's step is satisfied
  // (every worker alive at the step's start has completed it) or whether the
  // job has been cancelled (so a waiting worker can stop). A worker that runs
  // a job with a step barrier polls it after each step before proceeding to
  // the next.
  rpc CheckStepBarrier(CheckStepBarrierRequest) returns (CheckStepBarrierResponse);

  // Event log (F-23, high availability). The event log is the shared,
  // append-only coordination bus: the scheduler's background loops and the
  // API publish state changes to it, and every API pod tails it to fan events
  // out to its local workers and UI clients. Publishing a state change and
  // appending its event is a single transaction, so an event exists iff the
  // state changed.
  // PublishAssignment appends an "assignment" event for a job (a nudge: the
  // payload carries only the job id and target group, not the spec or token).
  // The job must already be persisted (pending).
  rpc PublishAssignment(PublishAssignmentRequest) returns (PublishEventResponse);
  // PublishCancel appends a "cancel" event for a job: a signal to the
  // execution target running the job to stop the work (F-05). Every API pod
  // tails the log and delivers the cancellation to its local workers, so a
  // cancellation signalled on one pod reaches a worker running the job on
  // another pod.
  rpc PublishCancel(PublishCancelRequest) returns (PublishEventResponse);
  // PublishJobStatus appends a "job_status" event for a job's status change.
  // The status change itself is persisted by the caller (e.g. via UpdateJob
  // or a conditional RPC); this only appends the event so the UI sees it.
  rpc PublishJobStatus(PublishJobStatusRequest) returns (PublishEventResponse);
  // PublishRunStatus appends a "run_status" event for a run's status change.
  rpc PublishRunStatus(PublishRunStatusRequest) returns (PublishEventResponse);
  // PublishWorkerEvent appends a "worker" event for a worker lifecycle change
  // (registered / deregistered / watching).
  rpc PublishWorkerEvent(PublishWorkerEventRequest) returns (PublishEventResponse);
  // PublishLogUpdated appends a "job_log_updated" event: a pointer that says a
  // job's log has grown to a given size. The log bytes themselves live in the
  // artifacts store, never in the event log; a consumer range-reads the delta
  // from the store.
  rpc PublishLogUpdated(PublishLogUpdatedRequest) returns (PublishEventResponse);
  // TailEvents returns the events with id greater than cursor, in id order,
  // up to limit. This is how an API pod tails the log: it keeps a per-pod
  // cursor, fetches the new events, fans them out, and advances the cursor.
  // When cursor is 0 the call returns the oldest retained events.
  rpc TailEvents(TailEventsRequest) returns (TailEventsResponse);

  // Leader election (F-23, high availability). The scheduler runs background
  // loops (watchdog, retry, dependency resolver, run-status, job-status) that
  // must run on exactly one replica at a time, or they would publish duplicate
  // events. A lease is the coordination primitive: a replica acquires a named
  // lease, renews it periodically, and runs the loops only while it holds it.
  //
  // Ownership and liveness are decoupled. The lease has a long TTL (a
  // backstop) that keeps the holder's ownership stable across transient
  // blips, and a short heartbeat window: the leader stamps a heartbeat on
  // every renewal, and a follower may take over as soon as the holder's
  // heartbeat is stale (older than the heartbeat window) even though the
  // long TTL has not lapsed. This detects a restarted or wedged leader
  // quickly (within a few missed heartbeats) instead of waiting for the full
  // TTL. The atomic compare-and-swap in AcquireLease still guarantees that at
  // most one replica takes over, so two replicas can never both lead.
  // AcquireLease acquires the named lease for the caller, or re-acquires it
  // if the caller already holds it (a renewal, which also refreshes the
  // heartbeat). It succeeds if the lease is free, its TTL has lapsed, its
  // heartbeat is stale, or it is already held by the caller; it fails if
  // another replica holds a live lease.
  rpc AcquireLease(AcquireLeaseRequest) returns (AcquireLeaseResponse);
  // ReleaseLease releases the named lease if the caller holds it.
  rpc ReleaseLease(ReleaseLeaseRequest) returns (google.protobuf.Empty);
  // GetLease returns the current state of the named lease (holder, TTL
  // expiry, and last heartbeat) so followers and observers can watch the
  // leader's liveness. A lease that has never been acquired is NotFound.
  rpc GetLease(GetLeaseRequest) returns (Lease);

  // Workers
  rpc RegisterWorker(RegisterWorkerRequest) returns (Worker);
  rpc GetWorker(GetWorkerRequest) returns (Worker);
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);
  rpc HeartbeatWorker(HeartbeatWorkerRequest) returns (Worker);
  rpc DeleteWorker(DeleteWorkerRequest) returns (google.protobuf.Empty);

  // IdP signing keys. The IdP persists its RSA signing keyring here so that
  // multiple IdP replicas share the same keys and serve a consistent JWKS.
  // ListIDPSigningKeys returns the current key plus any not-yet-expired
  // predecessors; SetIDPSigningKeys atomically replaces the whole keyring.
  rpc ListIDPSigningKeys(ListIDPSigningKeysRequest) returns (ListIDPSigningKeysResponse);
  rpc SetIDPSigningKeys(SetIDPSigningKeysRequest) returns (google.protobuf.Empty);

  // IdP authorization codes. The IdP stores single-use OIDC authorization
  // codes here so /auth and /token can be served by different replicas.
  rpc StoreIDPAuthCode(StoreIDPAuthCodeRequest) returns (google.protobuf.Empty);
  rpc ConsumeIDPAuthCode(ConsumeIDPAuthCodeRequest) returns (IDPAuthCode);
  rpc PruneIDPAuthCodes(PruneIDPAuthCodesRequest) returns (google.protobuf.Empty);

  // Secrets (F-12). NextSecretNonce returns the next value of the named
  // secret-nonce counter and atomically increments it. The counter is what
  // keeps the AES-GCM nonces unique across every API replica (they all share
  // one key from configuration, so they must share one nonce sequence); a
  // unique (key, nonce) pair is what makes AES-GCM safe. The counter is
  // persisted here so it survives API restarts and is shared by all replicas.
  rpc NextSecretNonce(NextSecretNonceRequest) returns (NextSecretNonceResponse);
}

// Parameter is a named, typed input a pipeline declares (F-10): a name, an
// optional default value, and an optional description. A run supplies
// concrete values for the pipeline's parameters (e.g. at trigger time or via
// a webhook); a parameter not supplied falls back to its default. A run's
// concrete parameter values are recorded on the run (its Params) and are
// interpolated into a job's spec (env, command, workdir) by the execution
// target before the job runs, using Go templates (text/template) like a
// step's condition: `{{ .params.name }}` (or `{{ .name }}`) renders the
// parameter's value. A reference to a parameter that has no value (no
// supplied value and no default) is a spec error that fails the job.
message Parameter {
  // name is the parameter's name; it must be unique within the pipeline.
  string name = 1;
  // default is the value used when a run does not supply a value for the
  // parameter; empty means the parameter has no default (a run that does not
  // supply it leaves it unset).
  string default = 2;
  // description is a human-readable description of the parameter.
  string description = 3;
}

// Secret is a named secret of a pipeline (F-12): a name and an encrypted
// value. The API encrypts the plaintext (with the configured key) when a
// pipeline is created or updated and decrypts it when it hands a job to an
// execution target; the database service stores the ciphertext opaquely and
// never sees the key or the plaintext. A job's step references a secret in a
// spec template as `{{ .secrets.name }}`.
message Secret {
  // name is the secret's name; it must be unique within the pipeline.
  string name = 1;
  // encrypted is the ciphertext (the API's encryption of the plaintext
  // value). It is opaque to every component except the API.
  string encrypted = 2;
}

message Pipeline {
  int64 id = 1;
  string name = 2;
  string description = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  // failure_mode is the pipeline's default failure mode (see FailureMode) for
  // its jobs that fan out to a worker group. A job that sets its own
  // failure_mode overrides the pipeline's; a job that sets none inherits this
  // value (defaulting to ALL when the pipeline sets none).
  FailureMode failure_mode = 6;
  // jobs are the pipeline's job definitions (F-08): the declarative jobs the
  // pipeline runs, each carrying a key, needs (dependencies, by key), target
  // group, and spec. A run of the pipeline creates one job instance per
  // definition (see CreateRun).
  repeated JobDefinition jobs = 7;
  // triggers are the ways a run of the pipeline can be started other than a
  // manual click (F-09): a cron schedule, a webhook, or an event (another
  // pipeline's run reaching a state).
  repeated Trigger triggers = 8;
  // params are the pipeline's parameter declarations (F-10): the named,
  // typed inputs a run can supply. A run's concrete values for them are
  // recorded on the run and interpolated into its jobs' specs by the
  // execution target.
  repeated Parameter params = 9;
  // version is the pipeline's current version (F-11): a monotonically
  // increasing counter bumped every time the definition changes (a create is
  // version 1; each edit is the next version). A run records the version it
  // executed (see PipelineRun.pipeline_version), so a run is bound to the
  // definition that was active when it started.
  int32 version = 10;
  // secrets are the pipeline's named secrets (F-12): each carries a name and
  // an encrypted value. The API encrypts the plaintext on create/update and
  // decrypts it at dispatch; a run's job instances carry the ciphertext
  // (denormalized from the pipeline) and the API hands the plaintext to the
  // execution target, where a step references it as `{{ .secrets.name }}`.
  repeated Secret secrets = 11;
}

// Trigger is a way to start a pipeline run other than a manual click (F-09).
// The type selects the trigger kind and the remaining fields carry the
// kind-specific settings:
//
//   - CRON: cron is a standard five-field cron expression (minute, hour,
//     day-of-month, month, day-of-week). The scheduler's cron loop starts a
//     run at each scheduled time.
//   - WEBHOOK: an external POST to the pipeline's webhook endpoint
//     (authenticated with the shared secret and/or the caller's OIDC token
//     claims) starts a run, passing the request's JSON body as run
//     parameters.
//   - EVENT: when the run of another pipeline (event_pipeline) reaches
//     event_status, a run of this pipeline is started (chaining).
//
// params are static run parameters merged into the run's parameters when the
// trigger fires (a webhook's payload overrides them on a key collision).
message Trigger {
  // name is the trigger's name; it must be unique within the pipeline.
  string name = 1;
  // type is the trigger kind (cron, webhook, or event).
  TriggerType type = 2;
  // cron is the cron expression for a cron trigger (five fields: minute,
  // hour, day-of-month, month, day-of-week).
  string cron = 3;
  // secret is the optional shared secret for a webhook trigger. When set, a
  // webhook POST must present it (in the X-Cdrom-Webhook-Secret header) to
  // start a run; when empty the trigger is open and any POST starts a run.
  string secret = 4;
  // event_pipeline is the name of the pipeline whose run reaching
  // event_status starts a run of this pipeline (an event trigger).
  string event_pipeline = 5;
  // event_status is the run status of event_pipeline that fires the trigger
  // (an event trigger).
  RunStatus event_status = 6;
  // params are static run parameters merged into the run's parameters when
  // the trigger fires.
  map<string, string> params = 7;
  // oidc_issuer is the OIDC issuer (a full URL, e.g.
  // https://github.com/login/oauth or the local IdP's address) of the token
  // a webhook caller must present to start a run (a webhook trigger). When
  // set, the API verifies the caller's Bearer token against this issuer's
  // JWKS and matches its claims against oidc_claims. When empty (and no
  // secret is set) the trigger is open.
  string oidc_issuer = 8;
  // oidc_claims are the claims a webhook caller's OIDC token must carry for
  // the trigger to match (a webhook trigger). Each key is a claim name and
  // each value is the expected value; a value of "*" is a wildcard that
  // matches any value for that claim (including the claim being absent).
  // Nested claims are addressed with a dot (e.g. "org.name") to reach a
  // claim that a provider nests (e.g. GitLab's "resource_access"). When
  // empty the trigger matches any token from oidc_issuer.
  map<string, string> oidc_claims = 9;
}

// TriggerType is the kind of a pipeline trigger (F-09).
enum TriggerType {
  TRIGGER_TYPE_UNSPECIFIED = 0;
  // TRIGGER_TYPE_CRON starts a run on a cron schedule.
  TRIGGER_TYPE_CRON = 1;
  // TRIGGER_TYPE_WEBHOOK starts a run from an external POST.
  TRIGGER_TYPE_WEBHOOK = 2;
  // TRIGGER_TYPE_EVENT starts a run when another pipeline's run reaches a
  // state (chaining).
  TRIGGER_TYPE_EVENT = 3;
}

message CreatePipelineRequest {
  string name = 1;
  string description = 2;
  // failure_mode is the pipeline's default failure mode for its jobs (see
  // Pipeline.failure_mode); UNSPECIFIED means the default (ALL).
  FailureMode failure_mode = 3;
  // jobs are the pipeline's job definitions (F-08); when present they are
  // created alongside the pipeline and the pipeline's DAG (each job's needs,
  // expressed as keys) is validated for cycles and unknown keys before
  // anything is persisted.
  repeated JobDefinition jobs = 4;
  // triggers are the pipeline's trigger definitions (F-09); when present
  // they are validated (unique names, kind-specific fields present) and
  // persisted alongside the pipeline.
  repeated Trigger triggers = 5;
  // params are the pipeline's parameter declarations (F-10); when present
  // they are validated (unique, non-empty names) and persisted alongside the
  // pipeline.
  repeated Parameter params = 6;
  // secrets are the pipeline's named secrets (F-12); when present they are
  // validated (unique, non-empty names) and persisted alongside the pipeline.
  // Each carries a name and an encrypted value (the API encrypts the
  // plaintext before calling).
  repeated Secret secrets = 7;
}

message GetPipelineRequest {
  int64 id = 1;
}

message ListPipelinesRequest {
  // trigger_type, when set (not UNSPECIFIED), restricts the result to
  // pipelines that have at least one trigger of that type (F-09). The
  // scheduler's cron and event loops use it to fetch only the pipelines they
  // act on. When UNSPECIFIED, all pipelines are returned.
  TriggerType trigger_type = 1;
}

message ListPipelinesResponse {
  repeated Pipeline pipelines = 1;
}

message UpdatePipelineRequest {
  int64 id = 1;
  string name = 2;
  string description = 3;
  // failure_mode, when set (not UNSPECIFIED), updates the pipeline's default
  // failure mode (see Pipeline.failure_mode).
  FailureMode failure_mode = 4;
  // jobs, when present, replaces the pipeline's job definitions (F-08): the
  // pipeline's existing job definitions are removed and these are created in
  // their place, and the resulting DAG is validated for cycles and unknown
  // keys before anything is persisted. When absent the pipeline's job
  // definitions are left unchanged.
  repeated JobDefinition jobs = 5;
  // triggers, when present, replaces the pipeline's trigger definitions
  // (F-09): the pipeline's existing triggers are removed and these are
  // created in their place, and they are validated (unique names,
  // kind-specific fields present) before anything is persisted. When absent
  // the pipeline's triggers are left unchanged.
  repeated Trigger triggers = 6;
  // params, when present, replaces the pipeline's parameter declarations
  // (F-10): the pipeline's existing parameters are removed and these are
  // created in their place, and they are validated (unique, non-empty names)
  // before anything is persisted. When absent the pipeline's parameters are
  // left unchanged.
  repeated Parameter params = 7;
  // secrets, when present, replaces the pipeline's named secrets (F-12): the
  // pipeline's existing secrets are removed and these are created in their
  // place, and they are validated (unique, non-empty names) before anything
  // is persisted. When absent the pipeline's secrets are left unchanged.
  repeated Secret secrets = 8;
}

message DeletePipelineRequest {
  int64 id = 1;
}

// RunStatus is the lifecycle state of a pipeline run (F-07). A run's status
// is derived from the statuses of its job instances: it is SUCCEEDED only if
// every non-skipped job succeeded, FAILED if any job failed or timed out,
// CANCELLED if the run was cancelled, and RUNNING while any job is still
// pending or running.
enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_PENDING = 1;
  RUN_STATUS_RUNNING = 2;
  RUN_STATUS_SUCCEEDED = 3;
  RUN_STATUS_FAILED = 4;
  RUN_STATUS_CANCELLED = 5;
}

// PipelineRun is one execution of a pipeline (F-07): a first-class execution
// entity that owns a set of job instances. A run separates the pipeline
// definition from each run of it, so the same pipeline can be executed many
// times and each run can be compared, reported on, and browsed historically.
//
// A run's job instances are the jobs that carry the run's id in run_id. The
// run's status is derived from those jobs (see RunStatus) and maintained by
// the scheduler's run-status loop.
message PipelineRun {
  int64 id = 1;
  // pipeline_id is the pipeline this run executed.
  int64 pipeline_id = 2;
  // status is the run's overall state, derived from its job instances.
  RunStatus status = 3;
  // trigger is how the run was started (e.g. "manual", "cron", "webhook", or
  // "event"); it is recorded so a run's origin is visible (F-09).
  string trigger = 4;
  // params are the run's parameters (F-10); empty until parameters land.
  map<string, string> params = 5;
  // started_at is when the run started (its first job began); unset until
  // then.
  google.protobuf.Timestamp started_at = 6;
  // finished_at is when the run reached a terminal status; unset while the
  // run is still in flight.
  google.protobuf.Timestamp finished_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // trigger_name is the name of the trigger that started the run (F-09);
  // empty for a manual run.
  string trigger_name = 10;
  // source_run_id is the id of the run that started this run (an event
  // trigger, F-09); 0 when the run was not started by an event trigger.
  int64 source_run_id = 11;
  // pipeline_name is the name of the pipeline this run executed (F-09); the
  // scheduler's event loop uses it to match a finished run against the
  // pipelines its event triggers watch, without fetching every pipeline.
  string pipeline_name = 12;
  // upstream_claims are the claims of the OIDC token a webhook caller
  // presented to start this run (F-09); empty for a run not started by a
  // webhook. They are the token's full claims as a JSON object, so a claim
  // that is itself an object or a list (e.g. GitLab's "user_identities" or
  // "job_config") keeps its structure rather than being flattened to a
  // string. They are denormalized onto the run's job instances so the API
  // can stamp them (prefixed with upstream_) onto the job tokens it hands to
  // execution targets, letting a job's steps (or the outside resources they
  // call) see who triggered the run.
  google.protobuf.Struct upstream_claims = 13;
  // pipeline_version is the version of the pipeline this run executed (F-11):
  // the version that was active when the run started. It is recorded so a run
  // is bound to the definition it executed — re-running an old run reproduces
  // the old definition, and "what exactly did run #42 execute?" is answerable
  // from the version snapshot. A run created against a specific version (a
  // re-run of an old run) records that version instead of the pipeline's
  // current one.
  int32 pipeline_version = 14;
}

message CreateRunRequest {
  // pipeline_id is the pipeline to execute.
  int64 pipeline_id = 1;
  // trigger is how the run was started (e.g. "manual").
  string trigger = 2;
  // params are the run's parameters (F-10); empty until parameters land.
  map<string, string> params = 3;
  // pipeline_version, when set (> 0), is the specific version of the pipeline
  // to execute (F-11): the run's job instances are created from that version's
  // definition snapshot rather than the pipeline's current definitions, and
  // the run records this version. This is how a run is re-executed against its
  // original version (a re-run of an old run reproduces the old definition).
  // When 0 the run executes the pipeline's current version.
  int32 pipeline_version = 4;
}

// CreateRunResponse is the result of CreateRun: the created run plus the job
// instances created for it (one per job definition in the pipeline). The
// scheduler uses the instances to drive the run (dispatching the
// dependency-free ones to the API).
message CreateRunResponse {
  PipelineRun run = 1;
  repeated Job jobs = 2;
}

// TriggerRunRequest is the request for TriggerRun (F-09): it names the
// pipeline and the trigger (by name) that fired, the trigger's kind (so the
// server knows the fire window to deduplicate against), and the run
// parameters to record on the run (a webhook's payload, or the trigger's
// static params).
message TriggerRunRequest {
  // pipeline_id is the pipeline to execute.
  int64 pipeline_id = 1;
  // trigger_name is the name of the trigger that fired (it must be one of
  // the pipeline's trigger definitions).
  string trigger_name = 2;
  // trigger_type is the kind of the trigger that fired (cron, webhook, or
  // event); it selects the fire window used to deduplicate the run.
  TriggerType trigger_type = 3;
  // params are the run's parameters (a webhook's payload, or the trigger's
  // static params). For an event trigger the caller records the source run's
  // id under the cdrom.source_run key, which the database deduplicates
  // against (the same source run can never start the same downstream run
  // twice).
  map<string, string> params = 4;
  // dedup_window is how long a run claimed by this trigger suppresses a
  // duplicate run of the same pipeline started by the same trigger (a cron
  // trigger passes its cron period, so a restart or a racing replica cannot
  // fire the same scheduled time twice). Zero means no time-based
  // deduplication (a webhook: every valid POST starts a run).
  google.protobuf.Duration dedup_window = 5;
  // upstream_claims are the claims of the OIDC token a webhook caller
  // presented to start the run (F-09); the database records them on the run
  // and denormalizes them onto its job instances so the API can stamp them
  // (prefixed with upstream_) onto the job tokens it hands to execution
  // targets. They are the token's full claims as a JSON object (a claim that
  // is an object or a list keeps its structure). Empty for a run not started
  // by a webhook.
  google.protobuf.Struct upstream_claims = 6;
}

// TriggerRunResponse is the result of TriggerRun: the run that claimed the
// trigger's fire window (created by this call, or by an earlier call that
// already claimed it) plus the job instances created for it (empty when an
// earlier call created the run), and whether this call created the run.
message TriggerRunResponse {
  PipelineRun run = 1;
  repeated Job jobs = 2;
  // created is true when this call created the run; false when an earlier
  // call already claimed the trigger's fire window (this call is a no-op).
  bool created = 3;
}

message GetRunRequest {
  int64 id = 1;
}

message ListRunsRequest {
  // pipeline_id of 0 lists runs for all pipelines.
  int64 pipeline_id = 1;
  // status of RUN_STATUS_UNSPECIFIED lists runs in all states.
  RunStatus status = 2;
  // finished_after, when set, lists only runs that finished at or after this
  // time (a run that has not finished is excluded). The scheduler's event
  // trigger loop (F-09) uses it to bound its scan to recently-finished runs.
  google.protobuf.Timestamp finished_after = 3;
}

message ListRunsResponse {
  repeated PipelineRun runs = 1;
}

message UpdateRunRequest {
  int64 id = 1;
  // status of RUN_STATUS_UNSPECIFIED leaves the status unchanged.
  RunStatus status = 2;
  // started_at, when set, records when the run started.
  google.protobuf.Timestamp started_at = 3;
  // finished_at, when set, records when the run finished.
  google.protobuf.Timestamp finished_at = 4;
}

// PipelineVersion is an immutable snapshot of a pipeline's definition at one
// version (F-11). Each change to a pipeline produces a new version; the
// database service stores one PipelineVersion row per version, capturing the
// definition (name, description, failure mode, job definitions, triggers, and
// parameters) exactly as it was. A run is bound to the version that was active
// when it started (see PipelineRun.pipeline_version), so "what exactly did run
// #42 execute?" is answerable from the version snapshot, and a run can be
// re-executed against its original version even after the pipeline has since
// been edited.
message PipelineVersion {
  int64 id = 1;
  // pipeline_id is the pipeline this version belongs to.
  int64 pipeline_id = 2;
  // version is the version number this snapshot represents (1-based; it
  // matches the pipeline's version at the time the snapshot was taken).
  int32 version = 3;
  // name is the pipeline's name at this version.
  string name = 4;
  // description is the pipeline's description at this version.
  string description = 5;
  // failure_mode is the pipeline's default failure mode at this version.
  FailureMode failure_mode = 6;
  // jobs are the pipeline's job definitions at this version (the declarative
  // form: key, name, target group, needs, and spec).
  repeated JobDefinition jobs = 7;
  // triggers are the pipeline's trigger definitions at this version.
  repeated Trigger triggers = 8;
  // params are the pipeline's parameter declarations at this version.
  repeated Parameter params = 9;
  google.protobuf.Timestamp created_at = 10;
  // secrets are the pipeline's named secrets at this version (F-12): each
  // carries a name and an encrypted value.
  repeated Secret secrets = 11;
}

message ListPipelineVersionsRequest {
  // pipeline_id is the pipeline to list versions for.
  int64 pipeline_id = 1;
}

message ListPipelineVersionsResponse {
  // versions are the pipeline's version snapshots, most recent first.
  repeated PipelineVersion versions = 1;
}

message GetPipelineVersionRequest {
  // pipeline_id is the pipeline the version belongs to.
  int64 pipeline_id = 1;
  // version is the version number to fetch.
  int32 version = 2;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_PENDING = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_SUCCEEDED = 3;
  JOB_STATUS_FAILED = 4;
  JOB_STATUS_CANCELLED = 5;
  // JOB_STATUS_TIMED_OUT is a terminal state: the job (or a step within it)
  // exceeded its declared timeout and was terminated. It is distinct from
  // FAILED so the UI and operators can tell a hung job apart from a job that
  // ran to completion and reported an error.
  JOB_STATUS_TIMED_OUT = 6;
  // JOB_STATUS_SKIPPED is a terminal state: the job never ran because one of
  // its dependencies (depends_on) did not succeed (F-06). It is distinct
  // from FAILED so reporting and on_failure logic can tell "didn't run" apart
  // from "ran and errored".
  JOB_STATUS_SKIPPED = 7;
}
// FailureMode controls how a job that runs on several workers (a job targeting
// a worker group, which runs on every worker in the group) is judged from the
// per-worker outcomes. It is set at the pipeline level and may be overridden
// per job; a job that sets no failure mode inherits its pipeline's (defaulting
// to ALL). It only affects jobs that fan out to more than one worker; a job on
// a single target is unaffected.
enum FailureMode {
  FAILURE_MODE_UNSPECIFIED = 0;
  // FAILURE_MODE_ALL: the job succeeds only if every worker's run succeeds;
  // any worker that fails or times out fails the job.
  FAILURE_MODE_ALL = 1;
  // FAILURE_MODE_BEST_EFFORT: the job succeeds if every worker's run reaches
  // a terminal state (a per-worker failure or timeout is recorded but does
  // not fail the job).
  FAILURE_MODE_BEST_EFFORT = 2;
  // FAILURE_MODE_ANY: the job succeeds as soon as one worker's run succeeds.
  FAILURE_MODE_ANY = 3;
}
// StepStatus is the terminal outcome of a single step within a job's
// execution spec (F-06). It mirrors a subset of JobStatus but only the
// states a step can actually reach: a step does not have its own pending or
// cancelled state (those belong to the job as a whole).
enum StepStatus {
  STEP_STATUS_UNSPECIFIED = 0;
  STEP_STATUS_SUCCEEDED = 1;
  STEP_STATUS_FAILED = 2;
  // STEP_STATUS_SKIPPED means the step's `condition` rendered to false, so
  // the step never ran; it does not fail the job.
  STEP_STATUS_SKIPPED = 3;
  STEP_STATUS_TIMED_OUT = 4;
}

// StepResult is the terminal outcome of one step of a job's execution spec,
// reported by the execution target alongside the job's own final status
// (F-06).
message StepResult {
  // index is the 0-based index of the step in the job's spec.
  int32 index = 1;
  StepStatus status = 2;
  // error is a descriptive error message; empty when status is SUCCEEDED or
  // SKIPPED.
  string error = 3;
  // outputs are the named values the step produced (F-06): each key is the
  // name of a file the step wrote into its per-step output directory, and
  // each value is that file's content (trimmed). Empty when the step wrote
  // no output files or did not run.
  map<string, string> outputs = 4;
}

// UpstreamJob is the status and outputs of a job higher up in the pipeline
// chain (F-06), handed to an execution target so a step's condition can
// reference an upstream job's status and outputs. The API populates it from
// the job's depends_on list when it hands the job to a target.
message UpstreamJob {
  int64 id = 1;
  string name = 2;
  JobStatus status = 3;
  // outputs are the named values the upstream job produced (F-06).
  map<string, string> outputs = 4;
}

// ParamValue is a single value in a step's params map. A value is either a
// scalar string or a list of strings (by convention, only one is set), so a
// handler can carry both simple settings (e.g. an ansible inventory name) and
// ordered lists (e.g. a command's arguments) in the same map.
message ParamValue {
  // string is a scalar value.
  string string = 1;
  // strings is an ordered list of values.
  repeated string strings = 2;
}

// JobStep is a single unit of work in a job's execution spec. A step is
// agnostic about *how* it runs: `type` selects a step handler, and the
// handler reads everything it needs from the common fields (`workdir`,
// `env`, `timeout`) and from `params`. The built-in default handler ("shell",
// used when `type` is empty) runs a command — optionally through a
// user-chosen shell — in a working directory with an environment.
//
// Handler-specific settings live in `params`, not in the step's own fields,
// so a new step type can be added without changing the spec schema. The
// built-in shell handler reads its `command`, `args`, and `shell` from
// params.
//
// Portability contract (shell handler): the command is resolved and executed
// directly by the execution target's OS (no shell is involved), so the same
// spec executes identically on Windows and Linux. `workdir` is interpreted
// with the target's native path separator; a relative workdir is resolved
// against the target's current working directory.
//
// Shell override (shell handler): when the `shell` param is set, the step is
// run through that shell instead of executing the command directly — the
// target invokes `<shell> <args> <command>`, so the command is passed as the
// final argument (e.g. `shell: "pwsh"`, `args: ["-NoProfile", "-Command"]`,
// `command: "Get-ChildItem"`). This lets a step opt into shell behavior
// (pipes, globbing, `$VAR` expansion) with an explicit, user-chosen shell
// rather than a platform default. When `shell` is empty the step runs the
// command directly, preserving the no-implicit-shell contract.
//
// Extensibility: `type` names a step handler registered on the execution
// target (the built-in "shell" handler is always available; a target may
// register more, e.g. "ansible", "terraform", "argo", or a user plugin). A
// step whose `type` is not registered on the target fails the job with a
// clear error.
//
// Condition (F-06): `condition` is a Go template (text/template) rendered
// against the step's own `env`; the rendered output must parse as a boolean
// (strconv.ParseBool: "1"/"t"/"true"/... or "0"/"f"/"false"/...). An empty
// `condition` always runs the step. When the rendered value is false the step
// is skipped (STEP_STATUS_SKIPPED) — it does not run and does not fail the
// job. A condition that fails to parse or render is a job-failing error (a
// bad condition is a spec error, not a reason to skip).
message JobStep {
  // Field numbers 1 (command), 2 (args), and 6 (shell) were retired when the
  // shell handler's settings moved into params; they are reserved so they are
  // never reused. Field 11 (outputs) was retired when the executor changed to
  // read every file in a step's output directory (the file name is the output
  // name), so a step no longer declares its outputs; it is reserved so it is
  // never reused.
  reserved 1, 2, 6, 11;
  // type selects the step handler that runs this step. Empty means the
  // built-in "shell" handler. A target that has not registered the named
  // handler rejects the step.
  string type = 7;
  // workdir is the directory the step runs in; empty means the target's
  // current working directory.
  string workdir = 3;
  // env are extra environment variables for the step, in addition to the
  // target's inherited environment.
  map<string, string> env = 4;
  // timeout is the maximum duration for this step; 0 means no per-step
  // timeout.
  google.protobuf.Duration timeout = 5;
  // params are the handler-specific settings for the step. The built-in
  // shell handler reads `command` (string), `args` (list of strings), and
  // `shell` (string) from here; a new step type reads the keys it
  // understands.
  map<string, ParamValue> params = 8;
  // condition is a Go template rendered against `env`; the step is skipped
  // when it renders to false (F-06). Empty always runs the step.
  string condition = 9;
  // ignore_failed, when true, means a failure (or timeout) of this step does
  // not fail the job (F-06): the step is recorded as failed/timed_out and the
  // job continues to the next step. A step that fails without ignore_failed
  // stops the job.
  bool ignore_failed = 10;
}

// RetryPolicy is a job's retry policy (F-04): how many times a failed job is
// re-dispatched and how long the scheduler waits between attempts.
message RetryPolicy {
  // max_attempts is the number of retries after the initial attempt; 0 means
  // the job is never retried. A job with max_attempts 2 runs at most 3 times
  // (the initial attempt plus 2 retries).
  int32 max_attempts = 1;
  // backoff is the delay before each retry; 0 means retries are dispatched
  // immediately.
  google.protobuf.Duration backoff = 2;
}

// JobSpec is the declarative execution spec of a job: an ordered list of
// steps. The execution target runs the steps in order and the job fails on
// the first step that errors.
message JobSpec {
  repeated JobStep steps = 1;
  // timeout is the maximum total duration for the whole job (all steps
  // combined); 0 means no job-level timeout. A step's own `timeout` bounds an
  // individual step; the job-level timeout bounds the sum of all steps. When
  // both are set, whichever expires first terminates the job. The execution
  // target enforces it by cancelling the running step; the scheduler's
  // watchdog reaps the job if the target goes silent (F-03).
  google.protobuf.Duration timeout = 2;
  // retry is the job's retry policy (F-04); when absent the job is never
  // retried.
  RetryPolicy retry = 3;
  // ignore_failed, when true, means a failure of the job does not propagate
  // to its dependents (F-06): the job is still reported failed (or
  // timed_out), but the scheduler's dependency resolver treats it as
  // satisfied, so downstream jobs are dispatched rather than skipped. It does
  // not change the job's own status or stop a failed step from failing the
  // job (that is a step's ignore_failed).
  bool ignore_failed = 4;
  // failure_mode controls how a job that runs on several workers (a job
  // targeting a worker group, which runs on every worker in the group) is
  // judged from the per-worker outcomes. It is set at the pipeline level and
  // may be overridden per job; a job that sets no failure mode inherits its
  // pipeline's (defaulting to ALL). It only affects jobs that fan out to
  // more than one worker; a job on a single target is unaffected.
  //   - ALL: the job succeeds only if every worker's run succeeds; any
  //     worker that fails or times out fails the job.
  //   - BEST_EFFORT: the job succeeds if every worker's run reaches a
  //     terminal state (a per-worker failure or timeout is recorded but does
  //     not fail the job).
  //   - ANY: the job succeeds as soon as one worker's run succeeds.
  FailureMode failure_mode = 5;
  // step_barrier, when true, makes a job that runs on several workers (a job
  // targeting a worker group) run its steps in lockstep: no worker proceeds
  // to step N+1 until every worker that is alive has completed step N. The
  // barrier is computed over the workers that are alive at the time each step
  // starts (a worker that dies mid-job is dropped from the barrier, so it
  // does not block the others). It only affects jobs that fan out to more
  // than one worker; a job on a single target is unaffected.
  bool step_barrier = 6;
}

message Job {
  int64 id = 1;
  // pipeline_id is 0 when the job does not belong to a pipeline.
  int64 pipeline_id = 2;
  string name = 3;
  JobStatus status = 4;
  // target_group selects a group of long-lived workers; empty means the job
  // runs on an ephemeral Kubernetes agent.
  string target_group = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // spec is the execution spec snapshot taken when the job was created. A
  // pipeline edit never changes what a past run did.
  JobSpec spec = 10;
  // attempt is the 1-based number of the attempt currently in flight (or the
  // last attempt, once the job is terminal). It is 1 for a job that has run
  // once and is incremented by the scheduler each time it re-dispatches a
  // failed job (F-04). The UI shows "attempt N of M" from this and
  // max_attempts.
  int32 attempt = 11;
  // max_attempts is the retry budget copied from the spec's retry policy when
  // the job was created (0 means the job is never retried). It is denormalized
  // onto the job so the UI can render "attempt N of M" without the spec.
  int32 max_attempts = 12;
  // depends_on lists the ids of jobs this job depends on. A job with a
  // non-empty depends_on is held pending (not dispatched) until every
  // dependency reaches a terminal state: if all of them succeed the job is
  // dispatched, but if any of them does not succeed (failed, cancelled,
  // timed_out, or itself skipped) the job is marked SKIPPED instead of
  // running. For jobs that belong to a pipeline, the user expresses
  // dependencies as `needs` (the keys of other jobs, F-08); the database
  // service resolves those keys to job ids and stores the result here when
  // the pipeline is saved, and CreateRun remaps them to the run's own
  // instance ids. For standalone jobs (no pipeline) depends_on is set
  // directly. The scheduler's dependency resolver (F-06/F-08) resolves it.
  repeated int64 depends_on = 13;
  // step_results is the terminal outcome of each step that ran (or was
  // skipped by its condition) during the job's current attempt (F-06). It is
  // reported by the execution target alongside the job's final status.
  repeated StepResult step_results = 14;
  // outputs are the named values the job produced (F-06): the union of its
  // steps' outputs (a later step overrides an earlier one on a name
  // collision). They are reported by the execution target and persisted so
  // downstream jobs on other targets can read them in their conditions.
  map<string, string> outputs = 15;
  // upstream_jobs are the status and outputs of the jobs this job depends on
  // (F-06), populated by the API when it hands the job to an execution target
  // so a step's condition can reference them. It is empty on the persisted
  // job (it is derived from depends_on at dispatch time).
  repeated UpstreamJob upstream_jobs = 16;
  // ignore_failed is the job's ignore-failed flag (F-06), denormalized from
  // the spec when the job was created. When true, a failed (or timed_out)
  // job is treated as satisfied by the scheduler's dependency resolver, so
  // its dependents are dispatched rather than skipped.
  bool ignore_failed = 17;
  // run_id is the pipeline run this job is an instance of (F-07); 0 when the
  // job is not part of a run (e.g. a standalone job submitted directly). A
  // job is a per-run instance of the pipeline's job definition: each run of a
  // pipeline creates its own set of job rows, so two runs of the same
  // pipeline are independent and both queryable.
  int64 run_id = 18;
  // failure_mode is the job's failure mode (see JobSpec.failure_mode),
  // denormalized from the spec (or the pipeline's default) when the job was
  // created. The scheduler's job-status loop uses it to derive the job's
  // overall status from the per-worker outcomes of a job that fanned out to
  // a worker group.
  FailureMode failure_mode = 19;
  // step_barrier is the job's step-barrier flag (see JobSpec.step_barrier),
  // denormalized from the spec when the job was created. When true, a job
  // that fanned out to a worker group runs its steps in lockstep: no worker
  // proceeds to step N+1 until every worker alive at step N's start has
  // completed step N.
  bool step_barrier = 20;
  // key is the job's stable, pipeline-scoped identifier (F-08): a short name
  // (e.g. "build", "test") that is unique within the pipeline the job belongs
  // to. Other jobs in the pipeline reference this job by its key (via their
  // `needs`), so a pipeline's DAG is stable across runs and survives
  // re-creation of the run's job instances. Empty when the job is not part of
  // a pipeline.
  string key = 21;
  // trigger_name is the name of the trigger that started the run this job is
  // an instance of (F-09); empty for a job not started by a named trigger.
  // It is denormalized from the run onto the job instance so the API can
  // stamp it onto the job token it hands to the execution target.
  string trigger_name = 22;
  // trigger_type is how the run this job is an instance of was started
  // (F-09): "manual", "cron", "webhook", or "event". It is denormalized from
  // the run onto the job instance so the API can stamp it onto the job token
  // it hands to the execution target.
  string trigger_type = 23;
  // upstream_claims are the claims of the OIDC token a webhook caller
  // presented to start the run this job is an instance of (F-09); empty for a
  // job not started by a webhook. They are the token's full claims as a JSON
  // object (a claim that is an object or a list keeps its structure) and are
  // denormalized from the run onto the job instance so the API can stamp them
  // (prefixed with upstream_) onto the job token it hands to the execution
  // target.
  google.protobuf.Struct upstream_claims = 24;
  // run_params are the run's concrete parameter values (F-10): the values
  // supplied for the pipeline's parameters (a parameter not supplied falls
  // back to its default), denormalized from the run onto the job instance.
  // The execution target interpolates them into the job's spec (env,
  // command, workdir) using Go templates before the job runs. Empty for a
  // job not part of a run (or a run with no parameters).
  map<string, string> run_params = 25;
  // secrets are the pipeline's named secrets for this run (F-12): a
  // name -> encrypted value list denormalized from the pipeline (or the
  // version snapshot) onto the job instance at run creation. The ciphertext
  // is opaque to the database service; the API decrypts it and hands the
  // plaintext to the execution target, where a step references it as
  // `{{ .secrets.name }}`.
  repeated Secret secrets = 26;
}

// JobDefinition is a job definition in a pipeline (F-08): the declarative
// form of a job that a pipeline carries, from which a run's job instances are
// created (see CreateRun). It carries everything a job instance copies from
// its definition except the per-run identity (id, run_id, status, and the
// remapped depends_on): the key (the job's stable name, F-08), the needs (the
// job's dependencies, expressed as the keys of other jobs in the pipeline,
// F-08), the target group, and the execution spec.
message JobDefinition {
  // key is the job's stable, pipeline-scoped identifier (F-08); it must be
  // unique within the pipeline and is what other jobs' needs reference.
  string key = 1;
  // name is the job's display name; when empty the pipeline's key is used.
  string name = 2;
  // target_group selects a group of long-lived workers; empty means the job
  // runs on an ephemeral Kubernetes agent.
  string target_group = 3;
  // spec is the execution spec to snapshot onto each of the job's run
  // instances; when absent the job has no steps and succeeds without doing
  // any work.
  JobSpec spec = 4;
  // needs lists the keys of the jobs this job depends on (F-08): the job is
  // held pending until every dependency succeeds (then it is dispatched) or
  // any of them does not (then it is marked skipped instead of running). An
  // unknown key or a cycle in the graph is rejected when the pipeline is
  // saved.
  repeated string needs = 5;
  // id is the job's id. It is ignored on input (a definition has no id before
  // it is created) and is populated on output: when a pipeline is created or
  // updated with job definitions, the returned definitions carry the ids of
  // the job rows that were created, so a caller can reference them.
  int64 id = 6;
}

message CreateJobRequest {
  int64 pipeline_id = 1;
  string name = 2;
  string target_group = 3;
  // spec is the execution spec to snapshot onto the job; when absent the job
  // has no steps and succeeds without doing any work.
  JobSpec spec = 4;
  // depends_on lists the ids of jobs this job depends on (F-06); see Job's
  // depends_on field for the gating/skip semantics.
  repeated int64 depends_on = 5;
  // run_id is the pipeline run this job is an instance of (F-07); 0 when the
  // job is not part of a run.
  int64 run_id = 6;
  // key is the job's stable, pipeline-scoped identifier (F-08); when the job
  // belongs to a pipeline it must be unique within that pipeline.
  string key = 7;
  // needs lists the keys of the jobs this job depends on (F-08); see
  // JobDefinition.needs for the gating/skip semantics and validation.
  repeated string needs = 8;
}

message GetJobRequest {
  int64 id = 1;
}

message ListJobsRequest {
  // pipeline_id of 0 lists jobs from all pipelines.
  int64 pipeline_id = 1;
  // status of JOB_STATUS_UNSPECIFIED lists jobs in all states.
  JobStatus status = 2;
  // run_id of 0 lists jobs from all runs.
  int64 run_id = 3;
}

message ListJobsResponse {
  repeated Job jobs = 1;
}

// ListRetriableJobsRequest is the (empty) request for ListRetriableJobs; it
// is present so the RPC has a request message and can grow filters later.
message ListRetriableJobsRequest {}

message UpdateJobRequest {
  int64 id = 1;
  JobStatus status = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
  // step_results replaces the job's recorded per-step outcomes for this
  // attempt (F-06); absent/empty leaves the previously recorded results
  // unchanged (e.g. the initial "running" report carries no step results
  // yet).
  repeated StepResult step_results = 5;
  // clear_depends_on clears the job's depends_on list (F-06). The scheduler's
  // dependency resolver sets this once every dependency has succeeded and the
  // job has been dispatched, so it is not reconsidered (and re-dispatched) on
  // the resolver's next tick.
  bool clear_depends_on = 6;
  // outputs replaces the job's recorded outputs (F-06); absent/empty leaves
  // the previously recorded outputs unchanged (e.g. the initial "running"
  // report carries no outputs yet).
  map<string, string> outputs = 7;
}

message ReapJobRequest {
  int64 id = 1;
  // finished_at is the timestamp to record when the job is reaped; when
  // absent the server stamps the current time.
  google.protobuf.Timestamp finished_at = 2;
}

message ReapJobResponse {
  // reaped is true when the job was still in a non-terminal state and was
  // marked timed_out; false when it had already reached a terminal state.
  bool reaped = 1;
}

message CancelJobRequest {
  int64 id = 1;
  // finished_at is the timestamp to record when the job is cancelled; when
  // absent the server stamps the current time.
  google.protobuf.Timestamp finished_at = 2;
}

message CancelJobResponse {
  // cancelled is true when the job was still in a non-terminal state and was
  // marked cancelled; false when it had already reached a terminal state.
  bool cancelled = 1;
}

message SkipJobRequest {
  int64 id = 1;
  // finished_at is the timestamp to record when the job is skipped; when
  // absent the server stamps the current time.
  google.protobuf.Timestamp finished_at = 2;
}

message SkipJobResponse {
  // skipped is true when the job was still pending and was marked skipped;
  // false when it had already started (or finished).
  bool skipped = 1;
}

message ClaimJobRequest {
  int64 id = 1;
  // started_at is the timestamp to record when the job is claimed; when
  // absent the server stamps the current time.
  google.protobuf.Timestamp started_at = 2;
}

message ClaimJobResponse {
  // claimed is true when the job was still pending and was marked running;
  // false when it had already started (or finished).
  bool claimed = 1;
}

message ListPendingByGroupRequest {
  // group is the worker group to list pending jobs for.
  string group = 1;
}

// JobExecution is one worker's run of a job (fan-out). A job that targets a
// worker group runs on every worker in the group; each worker's run is a
// separate JobExecution, tracked independently so the job's overall status can
// be derived from the per-worker outcomes (see FailureMode). A job that runs
// on a single target (an ephemeral agent, or a group with one worker) has a
// single execution.
message JobExecution {
  int64 id = 1;
  // job_id is the job this execution runs.
  int64 job_id = 2;
  // worker_name is the worker that runs (or ran) this execution.
  string worker_name = 3;
  // attempt is the job attempt this execution belongs to (F-04); a retry
  // creates a fresh set of executions.
  int32 attempt = 4;
  // status is this execution's state: RUNNING while the worker is executing
  // the job, and a terminal status (SUCCEEDED, FAILED, CANCELLED, or
  // TIMED_OUT) once the worker reports its outcome.
  JobStatus status = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // step_results is the terminal outcome of each step that ran (or was
  // skipped by its condition) during this worker's run of the job (F-06).
  repeated StepResult step_results = 10;
  // outputs are the named values this worker's run produced (F-06).
  map<string, string> outputs = 11;
}

// StartJobExecutionRequest asks the database to record that the calling
// worker has started running a job (fan-out). It creates the worker's
// JobExecution for the job's current attempt and marks the job running.
message StartJobExecutionRequest {
  // job_id is the job the worker is starting.
  int64 job_id = 1;
  // worker_name is the worker starting the job.
  string worker_name = 2;
  // started_at is the timestamp to record when the execution starts; when
  // absent the server stamps the current time.
  google.protobuf.Timestamp started_at = 3;
}

// StartJobExecutionResponse is the result of a StartJobExecution call. When
// started is true, execution carries the worker's new execution; when started
// is false the job was not started (it is no longer pending, or it is not
// targeted at a worker group) and execution is empty.
message StartJobExecutionResponse {
  // started is true when the worker's execution was recorded and the job is
  // running.
  bool started = 1;
  // execution is the worker's execution (set only when started is true).
  JobExecution execution = 2;
}

// ListJobExecutionsRequest asks for a job's executions (one per worker that
// started it, for its current attempt).
message ListJobExecutionsRequest {
  // job_id is the job to list executions for.
  int64 job_id = 1;
}

message ListJobExecutionsResponse {
  repeated JobExecution executions = 1;
}

// UpdateJobExecutionRequest records a worker's outcome for its execution of a
// job (fan-out).
message UpdateJobExecutionRequest {
  // job_id is the job the execution runs.
  int64 job_id = 1;
  // worker_name is the worker whose execution is updated.
  string worker_name = 2;
  // status is the execution's new status (a terminal status on the worker's
  // final report).
  JobStatus status = 3;
  // finished_at is the timestamp to record when the execution finishes; when
  // absent the server stamps the current time.
  google.protobuf.Timestamp finished_at = 4;
  // step_results replaces the execution's recorded per-step outcomes (F-06);
  // absent/empty leaves the previously recorded results unchanged.
  repeated StepResult step_results = 5;
  // outputs replaces the execution's recorded outputs (F-06); absent/empty
  // leaves the previously recorded outputs unchanged.
  map<string, string> outputs = 6;
}

// AbandonWorkerExecutionsRequest asks the database to abandon a worker's
// running executions (fan-out).
message AbandonWorkerExecutionsRequest {
  // worker_name is the worker whose running executions are abandoned.
  string worker_name = 1;
}

// StepCompletion is one worker's completion of a step of a job (the
// cross-worker step barrier). A job that runs on several workers with a step
// barrier runs its steps in lockstep: no worker proceeds to step N+1 until
// every worker that is alive has completed step N. Each worker's completion of
// a step is recorded here (one row per (job, worker, step, attempt)); the
// barrier for a step is satisfied once every worker alive at the step's start
// has a completion row for it.
message StepCompletion {
  int64 id = 1;
  // job_id is the job this step belongs to.
  int64 job_id = 2;
  // worker_name is the worker that completed the step.
  string worker_name = 3;
  // step_index is the 0-based index of the step in the job's spec.
  int32 step_index = 4;
  // attempt is the job attempt this completion belongs to (F-04); a retry
  // creates a fresh set of completions.
  int32 attempt = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// ReportStepCompletionRequest records that a worker has completed a step of a
// job (the cross-worker step barrier).
message ReportStepCompletionRequest {
  // job_id is the job the step belongs to.
  int64 job_id = 1;
  // worker_name is the worker that completed the step.
  string worker_name = 2;
  // step_index is the 0-based index of the step the worker completed.
  int32 step_index = 3;
}

// CheckStepBarrierRequest asks whether the barrier for a job's step is
// satisfied (every worker alive at the step's start has completed it) or
// whether the job has been cancelled (so a waiting worker can stop).
message CheckStepBarrierRequest {
  // job_id is the job to check.
  int64 job_id = 1;
  // step_index is the 0-based index of the step whose barrier is checked.
  int32 step_index = 2;
}

// CheckStepBarrierResponse is the result of a CheckStepBarrier call.
message CheckStepBarrierResponse {
  // satisfied is true when every worker alive at the step's start has
  // completed the step (the worker may proceed to the next step).
  bool satisfied = 1;
  // cancelled is true when the job has been cancelled (a waiting worker
  // should stop and report the job cancelled).
  bool cancelled = 2;
}

// ---------------------------------------------------------------------------
// Event log (F-23, high availability)
// ---------------------------------------------------------------------------

// Event is a row in the shared, append-only event log. It is a pointer, not
// the data: payload is a small JSON object with just enough to handle the
// event (e.g. a job id, or a log's new size), never the job spec, the log
// bytes, or a token. A consumer does a follow-up lookup to fetch the actual
// data, which keeps the table lean and makes it replay-safe.
message Event {
  // id is the monotonic cursor consumers track.
  int64 id = 1;
  // name is the event kind: "assignment", "cancel", "job_status",
  // "run_status", "worker", or "job_log_updated".
  string name = 2;
  // worker_group is the group the event is relevant to (for group-scoped
  // events like assignment); empty for events that are not group-scoped.
  string worker_group = 3;
  // payload is the small JSON object that carries the event's data.
  string payload = 4;
  google.protobuf.Timestamp created_at = 5;
}

message PublishAssignmentRequest {
  int64 job_id = 1;
  // target_group is the group the job targets (recorded so an API pod can
  // filter the event against the groups of its local workers).
  string target_group = 2;
}

message PublishCancelRequest {
  // job_id is the job to cancel.
  int64 job_id = 1;
}

message PublishJobStatusRequest {
  int64 job_id = 1;
  JobStatus status = 2;
  int32 attempt = 3;
  int32 max_attempts = 4;
}

message PublishRunStatusRequest {
  int64 run_id = 1;
  RunStatus status = 2;
}

message PublishWorkerEventRequest {
  string name = 1;
  string group = 2;
  // action is the worker lifecycle action: "registered", "deregistered", or
  // "watching".
  string action = 3;
}

message PublishLogUpdatedRequest {
  int64 job_id = 1;
  // log is the log file name (e.g. "job.log" or "step-0.log").
  string log = 2;
  int32 step_index = 3;
  // stream is the output stream: "stdout" or "stderr".
  string stream = 4;
  // size is the log's total size (in bytes) after the append; the consumer
  // range-reads [cursor, size) from the artifacts store.
  int64 size = 5;
}

message PublishEventResponse {
  // id is the id of the appended event (the cursor a consumer would see).
  int64 id = 1;
}

message TailEventsRequest {
  // cursor is the last event id the caller has processed; 0 means "from the
  // beginning of the retained window".
  int64 cursor = 1;
  // limit bounds how many events are returned in one call; 0 means the
  // server's default.
  int32 limit = 2;
}

message TailEventsResponse {
  repeated Event events = 1;
  // cursor is the id of the last event returned (the value to pass as cursor
  // on the next call); equal to the request's cursor when no events were
  // returned.
  int64 cursor = 2;
}

message AcquireLeaseRequest {
  // name is the name of the lease to acquire (e.g. "scheduler").
  string name = 1;
  // holder is the identity of the replica trying to acquire the lease.
  string holder = 2;
  // ttl is the lease's backstop validity from now: the holder keeps ownership
  // for this long even if it stops heartbeating (a crash or partition). It is
  // deliberately long so a transient blip does not hand leadership to a peer.
  google.protobuf.Duration ttl = 3;
  // heartbeat_ttl is the liveness window: a replica may take over the lease
  // once the current holder's last heartbeat is older than this, even if the
  // ttl backstop has not lapsed. It is deliberately short (a few missed
  // heartbeats) so a restarted or wedged leader is detected quickly. When
  // absent, the server's default is used.
  google.protobuf.Duration heartbeat_ttl = 4;
}

message AcquireLeaseResponse {
  // acquired is true when the caller now holds the lease (it was free, its
  // ttl had lapsed, its heartbeat was stale, or it was already held by the
  // caller); false when another replica holds a live lease.
  bool acquired = 1;
}

message ReleaseLeaseRequest {
  // name is the name of the lease to release.
  string name = 1;
  // holder is the identity of the replica releasing the lease; the lease is
  // released only if this replica holds it.
  string holder = 2;
}

message GetLeaseRequest {
  // name is the name of the lease to read (e.g. "scheduler").
  string name = 1;
}

// Lease is the current state of a named leader-election lease.
message Lease {
  // name is the lease's name (e.g. "scheduler").
  string name = 1;
  // holder is the identity of the replica that currently holds the lease.
  string holder = 2;
  // expires_at is when the lease's ttl backstop lapses (ownership is lost
  // then even if the holder is still heartbeating).
  google.protobuf.Timestamp expires_at = 3;
  // last_heartbeat is when the holder last renewed the lease; a follower may
  // take over once this is older than the heartbeat window.
  google.protobuf.Timestamp last_heartbeat = 4;
}

message ClaimJobRetryRequest {
  int64 id = 1;
}

message RerunJobRequest {
  int64 id = 1;
}

message ClaimJobRetryResponse {
  // claimed is true when the job was still in a non-terminal state and had
  // retries remaining; the attempt counter was incremented and the job reset
  // to pending. It is false when the job had already reached a terminal state
  // or had exhausted its retry budget.
  bool claimed = 1;
  // attempt is the 1-based attempt number the job was reset to (valid when
  // claimed is true).
  int32 attempt = 2;
}

message DeleteJobRequest {
  int64 id = 1;
}

message Worker {
  int64 id = 1;
  string name = 2;
  string group = 3;
  string address = 4;
  google.protobuf.Timestamp last_seen_at = 5;
}

message RegisterWorkerRequest {
  string name = 1;
  string group = 2;
  string address = 3;
}

message GetWorkerRequest {
  string name = 1;
}

message ListWorkersRequest {
  // group of "" lists workers in all groups.
  string group = 1;
}

message ListWorkersResponse {
  repeated Worker workers = 1;
}

message HeartbeatWorkerRequest {
  string name = 1;
}

message DeleteWorkerRequest {
  string name = 1;
}

// ---------------------------------------------------------------------------
// IdP signing keys
// ---------------------------------------------------------------------------

// IDPSigningKey is a single RSA signing key used by the IdP to sign JWTs.
message IDPSigningKey {
  string kid = 1;
  // is_current marks the key the IdP signs new tokens with.
  bool is_current = 2;
  google.protobuf.Timestamp not_before = 3;
  google.protobuf.Timestamp expires_at = 4;
  // pem is the PKCS8 PEM encoding of the RSA private key.
  string pem = 5;
}

message ListIDPSigningKeysRequest {}

message ListIDPSigningKeysResponse {
  repeated IDPSigningKey keys = 1;
}

message SetIDPSigningKeysRequest {
  repeated IDPSigningKey keys = 1;
}

// ---------------------------------------------------------------------------
// IdP authorization codes
// ---------------------------------------------------------------------------

// IDPAuthCode is a single-use OIDC authorization code issued by the IdP's
// authorization endpoint and redeemed at the token endpoint.
message IDPAuthCode {
  string code = 1;
  string client_id = 2;
  string redirect_uri = 3;
  // code_challenge is empty when PKCE was not used.
  string code_challenge = 4;
  string subject = 5;
  string name = 6;
  string email = 7;
  google.protobuf.Timestamp created_at = 8;
}

message StoreIDPAuthCodeRequest {
  IDPAuthCode code = 1;
}

message ConsumeIDPAuthCodeRequest {
  string code = 1;
}

message PruneIDPAuthCodesRequest {
  // created_before drops codes created before this instant; when unset, all
  // codes are pruned.
  google.protobuf.Timestamp created_before = 1;
}

// ---------------------------------------------------------------------------
// Secrets (F-12)
// ---------------------------------------------------------------------------

// NextSecretNonceRequest is the (empty) request for NextSecretNonce; it is
// present so the RPC has a request message and can grow a name filter later.
message NextSecretNonceRequest {}

// NextSecretNonceResponse is the result of a NextSecretNonce call.
message NextSecretNonceResponse {
  // nonce is the next value of the secret-nonce counter (the call also
  // atomically increments the counter, so no two callers ever get the same
  // value).
  int64 nonce = 1;
}
