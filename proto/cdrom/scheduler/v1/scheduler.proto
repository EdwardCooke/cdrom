syntax = "proto3";

package cdrom.scheduler.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

import "cdrom/db/v1/db.proto";

option go_package = "cdrom/internal/gen/cdrom/scheduler/v1;schedulerv1";

// Scheduler manages job lifecycle and dispatch.
//
// The API/controller layer calls SubmitJob to create a job. When the job
// targets a group of long-lived workers, the scheduler pushes it to the API
// (DispatchJob), which fans it out to the live workers in that group. Jobs
// with an empty target group are queued for ephemeral Kubernetes agents,
// which the control plane spawns.
//
// The scheduler persists all state through the Database service, so it holds
// no data of its own. Worker registration, WatchJobs streams, and job status
// reporting live on the API service, which is the single control plane that
// execution targets talk to.
service Scheduler {
  // Job control (called by the API/controller layer).
  rpc SubmitJob(SubmitJobRequest) returns (Job);
  rpc GetJob(GetJobRequest) returns (Job);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc CancelJob(CancelJobRequest) returns (Job);
  // RerunJob re-runs a finished job (F-04): it resets the job to pending
  // with a fresh attempt (attempt 1) and re-dispatches it, so the job runs
  // again with the same spec. Only jobs in a terminal state (succeeded,
  // failed, cancelled, or timed_out) can be re-run; a job that is still
  // pending or running is rejected.
  rpc RerunJob(RerunJobRequest) returns (Job);
  // CreateRun starts a new execution of a pipeline (F-07): it creates a
  // PipelineRun and one job instance per job definition in the pipeline,
  // then drives them (dispatching the dependency-free instances to the API,
  // which fans them out to the live workers; instances with dependencies are
  // left pending for the dependency resolver). The run's overall status is
  // derived from its job instances by the scheduler's run-status loop.
  rpc CreateRun(CreateRunRequest) returns (Run);
  // TriggerRun starts a run of a pipeline from a trigger (F-09): it atomically
  // claims the trigger's fire window (Database.TriggerRun, so a trigger can
  // never fire twice for the same window) and, when this call created the
  // run, drives its job instances exactly like CreateRun. The API's webhook
  // endpoint and the scheduler's cron and event loops call it.
  rpc TriggerRun(TriggerRunRequest) returns (Run);
}

message Job {
  int64 id = 1;
  int64 pipeline_id = 2;
  string name = 3;
  cdrom.db.v1.JobStatus status = 4;
  string target_group = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  // spec is the execution spec snapshot taken when the job was created.
  cdrom.db.v1.JobSpec spec = 8;
  // attempt is the 1-based number of the attempt currently in flight (or the
  // last attempt, once the job is terminal); 0 means the field is unset.
  int32 attempt = 9;
  // max_attempts is the job's retry budget (0 means the job is never
  // retried), so the UI can render "attempt N of M" (F-04).
  int32 max_attempts = 10;
  // depends_on lists the ids of jobs this job depends on (F-06).
  repeated int64 depends_on = 11;
  // step_results is the terminal outcome of each step that ran (or was
  // skipped by its condition) during the job's current attempt (F-06).
  repeated cdrom.db.v1.StepResult step_results = 12;
  // outputs are the named values the job produced (F-06).
  map<string, string> outputs = 13;
  // upstream_jobs are the status and outputs of the jobs this job depends on
  // (F-06), populated by the API when it hands the job to a target.
  repeated cdrom.db.v1.UpstreamJob upstream_jobs = 14;
  // ignore_failed is the job's ignore-failed flag (F-06), denormalized from
  // the spec when the job was created.
  bool ignore_failed = 15;
  // run_id is the pipeline run this job is an instance of (F-07); 0 when the
  // job is not part of a run.
  int64 run_id = 16;
  // key is the job's stable, pipeline-scoped identifier (F-08); empty when
  // the job is not part of a pipeline.
  string key = 17;
  // run_params are the run's concrete parameter values (F-10), denormalized
  // from the run onto the job instance. The execution target interpolates
  // them into the job's spec using Go templates before the job runs.
  map<string, string> run_params = 18;
}

message SubmitJobRequest {
  int64 pipeline_id = 1;
  string name = 2;
  // target_group selects a group of long-lived workers; empty means the job
  // is queued for an ephemeral Kubernetes agent.
  string target_group = 3;
  // spec is the execution spec to snapshot onto the job; when absent the job
  // has no steps and succeeds without doing any work.
  cdrom.db.v1.JobSpec spec = 4;
  // depends_on lists the ids of jobs this job depends on (F-06): the job is
  // held pending until every dependency succeeds (then it is dispatched) or
  // any of them does not (then it is marked skipped instead of running).
  repeated int64 depends_on = 5;
  // key is the job's stable, pipeline-scoped identifier (F-08); when the job
  // belongs to a pipeline it must be unique within that pipeline.
  string key = 6;
  // needs lists the keys of the jobs this job depends on (F-08); see
  // cdrom.db.v1.JobDefinition.needs for the gating/skip semantics.
  repeated string needs = 7;
}

message GetJobRequest {
  int64 id = 1;
}

message ListJobsRequest {
  int64 pipeline_id = 1;
  cdrom.db.v1.JobStatus status = 2;
}

message ListJobsResponse {
  repeated Job jobs = 1;
}

message CancelJobRequest {
  int64 id = 1;
}

message RerunJobRequest {
  int64 id = 1;
}

// Run is a pipeline run (F-07): one execution of a pipeline, owning a set of
// job instances. The scheduler's CreateRun RPC returns the created run; the
// run's job instances are the jobs that carry the run's id in run_id.
message Run {
  int64 id = 1;
  // pipeline_id is the pipeline this run executed.
  int64 pipeline_id = 2;
  // status is the run's overall state, derived from its job instances.
  cdrom.db.v1.RunStatus status = 3;
  // trigger is how the run was started (e.g. "manual", "cron", "webhook", or
  // "event"); it is recorded so a run's origin is visible (F-09).
  string trigger = 4;
  // params are the run's parameters (F-10); empty until parameters land.
  map<string, string> params = 5;
  // started_at is when the run started (its first job began); unset until
  // then.
  google.protobuf.Timestamp started_at = 6;
  // finished_at is when the run reached a terminal status; unset while the
  // run is still in flight.
  google.protobuf.Timestamp finished_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // trigger_name is the name of the trigger that started the run (F-09);
  // empty for a manual run.
  string trigger_name = 10;
  // source_run_id is the id of the run that started this run (an event
  // trigger, F-09); 0 when the run was not started by an event trigger.
  int64 source_run_id = 11;
}

message CreateRunRequest {
  // pipeline_id is the pipeline to execute.
  int64 pipeline_id = 1;
  // trigger is how the run was started (e.g. "manual").
  string trigger = 2;
  // params are the run's parameters (F-10); empty until parameters land.
  map<string, string> params = 3;
}

// TriggerRunRequest is the request for the scheduler's TriggerRun RPC (F-09):
// it names the pipeline and the trigger (by name) that fired, the trigger's
// kind (so the fire window can be deduplicated), and the run parameters to
// record on the run.
message TriggerRunRequest {
  // pipeline_id is the pipeline to execute.
  int64 pipeline_id = 1;
  // trigger_name is the name of the trigger that fired.
  string trigger_name = 2;
  // trigger_type is the kind of the trigger that fired (cron, webhook, or
  // event); it selects the fire window used to deduplicate the run.
  cdrom.db.v1.TriggerType trigger_type = 3;
  // params are the run's parameters (a webhook's payload, or the trigger's
  // static params).
  map<string, string> params = 4;
  // dedup_window is how long a run claimed by this trigger suppresses a
  // duplicate run of the same pipeline started by the same trigger (a cron
  // trigger passes its cron period, so a restart or a racing replica cannot
  // fire the same scheduled time twice). Zero means no time-based
  // deduplication (a webhook: every valid POST starts a run).
  google.protobuf.Duration dedup_window = 5;
  // upstream_claims are the claims of the OIDC token a webhook caller
  // presented to start the run (F-09); the scheduler passes them to the
  // database, which records them on the run and denormalizes them onto its
  // job instances. They are the token's full claims as a JSON object (a claim
  // that is an object or a list keeps its structure). Empty for a run not
  // started by a webhook.
  google.protobuf.Struct upstream_claims = 6;
}
