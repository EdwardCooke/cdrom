syntax = "proto3";

package cdrom.api.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

import "cdrom/db/v1/db.proto";
import "cdrom/artifacts/v1/artifacts.proto";

option go_package = "cdrom/internal/gen/cdrom/api/v1;apiv1";

// API is the gRPC surface the API/controller service exposes to execution
// targets (long-lived workers and ephemeral agents) and to the scheduler.
//
// Workers and agents talk ONLY to the API. The API is the single control
// plane: it holds the workers' WatchJobs streams, relays job assignments
// pushed by the scheduler (DispatchJob), and proxies artifact
// uploads/downloads to the artifacts service.
service API {
  // Worker lifecycle (called by long-lived workers).
  rpc RegisterWorker(RegisterWorkerRequest) returns (Worker);
  rpc DeregisterWorker(DeregisterWorkerRequest) returns (google.protobuf.Empty);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Execution side (called by workers and agents).
  //
  // WatchJobs is a server stream: the worker identifies itself and receives a
  // WatchMessage for every job dispatched to its group (a JobAssignment or a
  // JobNudge, F-23) and for every cancellation of a job it is running (a
  // JobCancellation, F-05).
  rpc WatchJobs(WatchJobsRequest) returns (stream WatchMessage);
  rpc GetJob(GetJobRequest) returns (Job);
  // StartJobExecution records that the calling worker has started running a
  // job (fan-out): it creates the worker's JobExecution for the job's current
  // attempt (via the Database service) and returns the job with its spec,
  // upstream jobs, and a fresh job token. A job that targets a worker group
  // runs on every worker in the group, so the start is not exclusive — every
  // worker in the group starts its own execution. Starting an execution for a
  // job that is no longer pending (it reached a terminal state, or it is not
  // targeted at the worker's group) is rejected, so a job that finished
  // before a slow worker started it is not run.
  rpc StartJobExecution(StartJobExecutionRequest) returns (StartJobExecutionResponse);
  // ListPendingJobs returns the pending jobs that target the caller's worker
  // group (F-23). This is the worker's pull path: it polls it on a short
  // interval to pick up jobs that were published while it was unreachable, so
  // no job is stranded pending. It wraps the Database service's
  // ListPendingByGroup.
  rpc ListPendingJobs(ListPendingJobsRequest) returns (ListPendingJobsResponse);
  rpc ReportJobStatus(ReportJobStatusRequest) returns (Job);
  // ReportStepCompletion records that the calling worker has completed a step
  // of a job (the cross-worker step barrier). A worker that runs a job with a
  // step barrier reports each step it finishes; the barrier for a step is
  // satisfied once every worker that is alive has completed it. The API
  // forwards the completion to the Database service. When job-token auth is
  // enabled the caller must present a job token scoped to the job.
  rpc ReportStepCompletion(ReportStepCompletionRequest) returns (google.protobuf.Empty);
  // CheckStepBarrier reports whether the barrier for a job's step is satisfied
  // (every worker alive at the step's start has completed it) or whether the
  // job has been cancelled (so a waiting worker can stop). A worker that runs
  // a job with a step barrier polls it after each step before proceeding to
  // the next. The API forwards the check to the Database service. When
  // job-token auth is enabled the caller must present a job token scoped to
  // the job.
  rpc CheckStepBarrier(CheckStepBarrierRequest) returns (CheckStepBarrierResponse);
  // CancelJob is called by the scheduler to signal the execution target
  // running a job to stop the work (F-05). The API delivers a JobCancellation
  // down the worker's WatchJobs stream (for a long-lived worker) or, for an
  // ephemeral agent, records the cancellation so the agent's next GetJob
  // reflects it. It is a no-op when the job is not running on a live target.
  rpc CancelJob(CancelJobRequest) returns (google.protobuf.Empty);

  // StreamJobLogs is a client stream: an execution target (worker or agent)
  // opens it at the start of a job and sends a JobLogChunk for each chunk of
  // step output (stdout/stderr). The first chunk of each step carries
  // metadata (job_id, step_index, stream); subsequent chunks carry data. The
  // API persists the output to the artifacts service (one file per step plus
  // a combined job.log) and fans it out to the UI over the WebSocket event
  // hub as a job_log event. When job-token auth is enabled the caller must
  // present a job token scoped to the job.
  rpc StreamJobLogs(stream JobLogChunk) returns (StreamJobLogsResponse);

  // ExchangeJobToken lets a running job request a new job token with a
  // different audience (e.g. for an outside resource the job needs to call).
  // The caller presents its current job token; the API mints a replacement
  // scoped to the same job but the requested audience. Like GitHub Actions
  // runners requesting a new token for a different audience mid-job.
  rpc ExchangeJobToken(ExchangeJobTokenRequest) returns (ExchangeJobTokenResponse);

  // Dispatch (called by the scheduler). The scheduler pushes a job here; the
  // API fans it out to the live workers in the job's target group.
  rpc DispatchJob(DispatchJobRequest) returns (DispatchJobResponse);

  // NotifyJobStatus (called by the scheduler). The scheduler's watchdog uses
  // it to fan a job-status change (e.g. a job reaped as timed_out) out to the
  // UI over the WebSocket event hub, and the retry loop (F-04) uses it to fan
  // out a retried job's reset to pending. It mirrors the job_status events
  // the API publishes when a target reports a status. It does not touch the
  // database (the scheduler already persisted the change); it only publishes
  // the event.
  rpc NotifyJobStatus(NotifyJobStatusRequest) returns (google.protobuf.Empty);

  // NotifyRunStatus (called by the scheduler). The scheduler's run-status
  // loop (F-07) uses it to fan a pipeline-run status change (e.g. a run that
  // just succeeded or failed) out to the UI over the WebSocket event hub. It
  // mirrors the run_status events the API publishes when a run's derived
  // status changes. It does not touch the database (the scheduler already
  // persisted the change); it only publishes the event.
  rpc NotifyRunStatus(NotifyRunStatusRequest) returns (google.protobuf.Empty);

  // Artifact proxy (called by workers and agents). The API forwards these to
  // the artifacts service so execution targets never talk to it directly.
  rpc UploadArtifact(stream cdrom.artifacts.v1.ArtifactChunk)
      returns (cdrom.artifacts.v1.UploadArtifactResponse);
  rpc DownloadArtifact(cdrom.artifacts.v1.DownloadArtifactRequest)
      returns (stream cdrom.artifacts.v1.ArtifactChunk);
  rpc GetArtifact(cdrom.artifacts.v1.GetArtifactRequest)
      returns (cdrom.artifacts.v1.Artifact);
  rpc ListArtifacts(cdrom.artifacts.v1.ListArtifactsRequest)
      returns (cdrom.artifacts.v1.ListArtifactsResponse);
  rpc DeleteArtifact(cdrom.artifacts.v1.DeleteArtifactRequest)
      returns (google.protobuf.Empty);
}

message Worker {
  string name = 1;
  string group = 2;
  string address = 3;
  google.protobuf.Timestamp last_seen_at = 4;
}

message RegisterWorkerRequest {
  string name = 1;
  string group = 2;
  string address = 3;
}

message DeregisterWorkerRequest {
  string name = 1;
}

message HeartbeatRequest {
  string name = 1;
}

message HeartbeatResponse {
  // poll_interval_seconds is the interval the API recommends the worker use
  // for heartbeats.
  int32 poll_interval_seconds = 1;
}

message Job {
  int64 id = 1;
  int64 pipeline_id = 2;
  string name = 3;
  cdrom.db.v1.JobStatus status = 4;
  string target_group = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  // token is the job token the API hands to the execution target that
  // fetches this job (set on GetJob for agents). It authenticates the target
  // back to the API and to outside resources for the duration of the job.
  string token = 8;
  // spec is the execution spec snapshot taken when the job was created. The
  // execution target runs the steps in order and the job fails on the first
  // step that errors.
  cdrom.db.v1.JobSpec spec = 9;
  // attempt is the 1-based attempt number of the execution (F-04); 0 means
  // the field is unset (e.g. a job that has not been dispatched yet).
  int32 attempt = 10;
  // max_attempts is the job's retry budget (0 means the job is never
  // retried), so the UI can render "attempt N of M".
  int32 max_attempts = 11;
  // depends_on lists the ids of jobs this job depends on (F-06).
  repeated int64 depends_on = 12;
  // step_results is the terminal outcome of each step that ran (or was
  // skipped by its condition) during the job's current attempt (F-06).
  repeated cdrom.db.v1.StepResult step_results = 13;
  // outputs are the named values the job produced (F-06); reported by the
  // execution target and persisted so downstream jobs can read them.
  map<string, string> outputs = 14;
  // upstream_jobs are the status and outputs of the jobs this job depends on
  // (F-06), populated by the API when it hands the job to a target so a step's
  // condition can reference them.
  repeated cdrom.db.v1.UpstreamJob upstream_jobs = 15;
  // ignore_failed is the job's ignore-failed flag (F-06), denormalized from
  // the spec when the job was created.
  bool ignore_failed = 16;
  // run_id is the pipeline run this job is an instance of (F-07); 0 when the
  // job is not part of a run.
  int64 run_id = 17;
  // failure_mode is the job's failure mode (see cdrom.db.v1.FailureMode),
  // denormalized from the spec (or the pipeline's default) when the job was
  // created. It controls how a job that fanned out to a worker group is
  // judged from the per-worker outcomes.
  cdrom.db.v1.FailureMode failure_mode = 18;
  // step_barrier is the job's step-barrier flag, denormalized from the spec
  // when the job was created. When true, a job that fans out to a worker
  // group synchronizes its workers at each step boundary: after a worker
  // completes a step it waits until every worker alive at the step's start has
  // completed it before starting the next step.
  bool step_barrier = 19;
  // key is the job's stable, pipeline-scoped identifier (F-08); empty when
  // the job is not part of a pipeline.
  string key = 20;
}

message JobAssignment {
  Job job = 1;
  // worker_name is the worker this assignment was dispatched to.
  string worker_name = 2;
  // token is the job token the worker presents to the API (and to outside
  // resources) while executing the job.
  string token = 3;
}

// JobCancellation is a signal to stop the work of a job that is running on
// the target (F-05). The target interrupts the running step (terminating the
// command) and reports the job as cancelled.
message JobCancellation {
  // job_id is the job to cancel.
  int64 job_id = 1;
}

// JobNudge is a lightweight "you have a job" signal (F-23). It carries only
// the job id, not the spec or token: on receiving it the worker calls GetJob
// to fetch the fresh spec, job token, and upstream jobs, then claims and runs
// the job. This keeps the shared event log lean and replay-safe (a replayed
// nudge can never carry a stale spec or an expired token). It is the push
// (fast-path) counterpart to the worker's periodic poll of pending jobs.
message JobNudge {
  // job_id is the job the worker should fetch and run.
  int64 job_id = 1;
}

// WatchMessage is a single message on a worker's WatchJobs stream. Exactly
// one of its fields is set: an assignment (a new job to run, carrying the
// full job + token), a nudge (a new job to run, by id only — the worker
// fetches it via GetJob, F-23), or a cancellation (stop a job the worker is
// running, F-05).
message WatchMessage {
  oneof message {
    JobAssignment assignment = 1;
    JobCancellation cancellation = 2;
    JobNudge nudge = 3;
  }
}

message WatchJobsRequest {
  string worker_name = 1;
  string group = 2;
}

// CancelJobRequest asks the API to signal the execution target running the
// job to stop the work (F-05).
message CancelJobRequest {
  int64 job_id = 1;
}

message GetJobRequest {
  int64 id = 1;
}

// StartJobExecutionRequest asks the API to record that the calling worker has
// started running a job (fan-out).
message StartJobExecutionRequest {
  // job_id is the job the worker is starting.
  int64 job_id = 1;
  // worker_name is the worker starting the job.
  string worker_name = 2;
}

// StartJobExecutionResponse is the result of a StartJobExecution call. When
// started is true, job carries the job (spec, upstream jobs, and a fresh job
// token); when started is false the job was no longer pending (it reached a
// terminal state, or it is not targeted at the worker's group) and job is
// empty.
message StartJobExecutionResponse {
  // started is true when the worker's execution was recorded and the job is
  // running.
  bool started = 1;
  // job is the job the worker will run (set only when started is true).
  Job job = 2;
}

// ListPendingJobsRequest asks the API for the pending jobs that target the
// caller's worker group (F-23).
message ListPendingJobsRequest {
  // group is the worker group to list pending jobs for.
  string group = 1;
}

message ListPendingJobsResponse {
  repeated Job jobs = 1;
}

message ReportJobStatusRequest {
  int64 job_id = 1;
  cdrom.db.v1.JobStatus status = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
  // step_results is the terminal outcome of each step that ran (or was
  // skipped by its condition) so far in this attempt (F-06); absent/empty
  // leaves the previously recorded results unchanged.
  repeated cdrom.db.v1.StepResult step_results = 5;
  // outputs are the named values the job produced (F-06); absent/empty leaves
  // the previously recorded outputs unchanged.
  map<string, string> outputs = 6;
  // worker_name is the worker reporting the status (set by long-lived
  // workers). When set and the job targets a worker group, the status is
  // recorded against the worker's execution of the job (fan-out) rather than
  // the job row; the job's overall status is derived from the executions by
  // the scheduler. An ephemeral agent (no worker name) reports against the
  // job row directly.
  string worker_name = 7;
}

// ReportStepCompletionRequest records that the calling worker has completed a
// step of a job (the cross-worker step barrier).
message ReportStepCompletionRequest {
  // job_id is the job the step belongs to.
  int64 job_id = 1;
  // worker_name is the worker that completed the step.
  string worker_name = 2;
  // step_index is the 0-based index of the step the worker completed.
  int32 step_index = 3;
}

// CheckStepBarrierRequest asks whether the barrier for a job's step is
// satisfied or whether the job has been cancelled.
message CheckStepBarrierRequest {
  // job_id is the job to check.
  int64 job_id = 1;
  // step_index is the 0-based index of the step whose barrier is checked.
  int32 step_index = 2;
}

// CheckStepBarrierResponse is the result of a CheckStepBarrier call.
message CheckStepBarrierResponse {
  // satisfied is true when every worker alive at the step's start has
  // completed the step (the worker may proceed to the next step).
  bool satisfied = 1;
  // cancelled is true when the job has been cancelled (a waiting worker
  // should stop and report the job cancelled).
  bool cancelled = 2;
}

// JobLogStream names which output stream a chunk of log data belongs to.
enum JobLogStream {
  JOB_LOG_STREAM_UNSPECIFIED = 0;
  // JOB_LOG_STREAM_STDOUT is the step's standard output.
  JOB_LOG_STREAM_STDOUT = 1;
  // JOB_LOG_STREAM_STDERR is the step's standard error.
  JOB_LOG_STREAM_STDERR = 2;
}

// JobLogMetadata identifies the log a chunk of data belongs to. It is set on
// the first chunk of each step's output (and on the first chunk of the
// stream); it is empty on all other chunks.
message JobLogMetadata {
  // job_id is the job the log belongs to.
  int64 job_id = 1;
  // step_index is the 0-based index of the step in the job's spec.
  int32 step_index = 2;
  // stream is which output (stdout or stderr) the data came from.
  JobLogStream stream = 3;
}

// JobLogChunk is a single unit of streamed job output. The first chunk of a
// step's output carries metadata; all chunks carry data.
message JobLogChunk {
  JobLogMetadata metadata = 1;
  bytes data = 2;
}

message StreamJobLogsResponse {
  // received is the total number of log bytes the API has persisted for the
  // job so far.
  int64 received = 1;
}

message DispatchJobRequest {
  Job job = 1;
}

message DispatchJobResponse {
  // dispatched is the number of live workers that received the assignment.
  int32 dispatched = 1;
}

message NotifyJobStatusRequest {
  int64 job_id = 1;
  cdrom.db.v1.JobStatus status = 2;
  // attempt is the 1-based attempt number of the job (F-04); 0 means the
  // field is unset. The scheduler passes it so the UI can render "attempt N
  // of M" on the fanned-out job_status event.
  int32 attempt = 3;
  // max_attempts is the job's retry budget (0 means the job is never
  // retried).
  int32 max_attempts = 4;
}

// NotifyRunStatusRequest asks the API to fan a pipeline-run status change out
// to the UI (F-07). The scheduler's run-status loop persists the change
// through the Database service and then calls this to publish the event.
message NotifyRunStatusRequest {
  // run_id is the run whose status changed.
  int64 run_id = 1;
  // status is the run's new overall status.
  cdrom.db.v1.RunStatus status = 2;
}

message ExchangeJobTokenRequest {
  // job_id is the job the caller is executing.
  int64 job_id = 1;
  // audience is the audience the new token should be valid for (e.g. an
  // outside resource the job needs to authenticate to).
  string audience = 2;
}

message ExchangeJobTokenResponse {
  // token is the new job token, scoped to the same job but the requested
  // audience.
  string token = 1;
}
