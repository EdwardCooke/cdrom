# Example Cdrom configuration file.
#
# Pass it to any cdrom binary with:
#
#   ./bin/api --config-file config.yaml
#
# Every key is optional; omitted keys fall back to built-in defaults.
# Environment variables (see AGENTS.md) take precedence over this file.

# Address this binary's own gRPC server binds to (the gRPC port for the
# service servers and for the API). The API's HTTP port for the UI is set
# separately with api_http_address.
#listen_address: 127.0.0.1:7105

# gRPC addresses of the services.
#db_address: 127.0.0.1:7101
#scheduler_address: 127.0.0.1:7102
#artifacts_address: 127.0.0.1:7103
#api_address: 127.0.0.1:7105

# HTTP address the API binds for the UI.
#api_http_address: 127.0.0.1:8080

# Storage backend (used by the db service).
db:
  backend: sqlite # sqlite | postgres
  sqlite_path: cdrom.db
  #postgres_dsn: "host=... user=... password=... dbname=... sslmode=..."

# Filesystem root for artifact storage (used by the artifacts service).
#artifacts_root: artifacts

# Storage backend for the artifacts service (artifacts and job logs). The
# built-in default is "filesystem"; "s3" and "azureblob" are reserved for
# future built-in implementations.
#artifacts_store: filesystem

# Worker identity (used by the worker).
#worker_name: worker-1
#worker_group: default

# Job an ephemeral agent was spawned to execute (used by the agent).
#agent_job_id: "123"

# Identity of an ephemeral agent (used by the agent). Defaults to the host
# name the agent runs on; reported with the job's status so the API can
# record which target ran the job.
#agent_name: my-host

# Mutual TLS for gRPC communication between services. When ca_file is set,
# all gRPC traffic uses mTLS; otherwise it is plaintext. Generate a local
# dev certificate set with `make certs`, then point all three paths at it.
# The same config file works for every binary (services and clients).
#tls:
#  ca_file: certs/ca.crt
#  cert_file: certs/cert.crt
#  key_file: certs/cert.key

# OIDC authentication for the API's UI-facing HTTP surface and its WebSocket
# endpoint. Disabled by default: when enabled is false (or unset) the API is
# open and no identity provider is required. When enabled, the API is a pure
# token verifier: a client signs in against the identity provider via the
# authorization-code + PKCE flow (issuer/client_id/redirect_url) and then
# presents the resulting OAuth token on every request as
# `Authorization: Bearer <token>`. The API verifies the token against the
# IdP's JWKS — there is no session cookie. GET /api/auth/oidc advertises the
# IdP's discovery document so a client can start the flow.
#
# userpass_enabled (default: true) turns on username/password authentication:
# the API exposes unauthenticated POST /api/login and POST /api/register
# (plus admin-only /api/users for role management) that proxy to the IdP, where
# credentials are verified and an OIDC token is minted. It is enabled by
# default so a local development run can sign in with a password without a full
# OIDC client; set it to false when using an external identity provider.
#auth:
#  enabled: true
#  userpass_enabled: true   # default; set false to disable /api/login & /api/register
#  issuer: https://accounts.example.com/realms/cdrom
#  client_id: cdrom-ui
#  redirect_url: http://localhost:8080/api/auth/callback
#  # scopes: [openid, profile, email]   # defaults to these when omitted
#  # Audience accepted on verified tokens. When set, the verifier checks the
#  # token's aud against this value; when empty it checks against client_id.
#  # token_audience: cdrom-api
#
#  # Role-based access control (F-14). RBAC is enforced whenever auth is
#  # enabled: a request is allowed only if the caller's roles grant the
#  # required permission (with a scope that covers the target resource). Roles
#  # reach a principal through the token's roles claim (stamped by the built-in
#  # IdP), the claim mapping below, and stored role bindings (managed via
#  # /api/roles and /api/role-bindings).
#  #
#  # JWT claim mapping: read a configurable claim from a token from ANY IdP
#  # (including an external enterprise IdP) and map its values to role names,
#  # so group membership in the corporate IdP drives Cdrom roles without
#  # Cdrom's user directory knowing the user at all. When role_claim is empty,
#  # claim mapping is disabled.
#  #roles:
#  #  # The token claim to read (e.g. "groups", "roles", or "scope").
#  #  role_claim: groups
#  #  # Map a claim value to a role name (unmapped values are ignored unless
#  #  # role_claim_as_names is true).
#  #  role_mappings:
#  #    platform-ops: operator
#  #    platform-admins: admin
#  #  # Treat each claim value as a role name directly (in addition to any
#  #  # role_mappings).
#  #  role_claim_as_names: false

# Local OIDC identity provider (used by the idp binary, cmd/idp). It acts as a
# JWT issuer for the API's OIDC authentication. It serves the standard OIDC
# surface over HTTP (the discovery doc, a JWKS, an authorization endpoint
# (authorization-code + PKCE), and a token endpoint that mints RS256 ID
# tokens) and its API-only surface over gRPC (job-token minting and user
# management). It signs with an RSA key and rotates it automatically when the
# key is within rotate_before of its expiry; the JWKS keeps serving predecessor
# keys until they expire so clients keep verifying older tokens.
#
# The IdP's state — its signing keyring, its OIDC authorization codes, and its
# user directory — is persisted through the Database service (db_address), not
# on the IdP's local filesystem. This makes the IdP horizontally scalable:
# multiple IdP replicas share the same keys, codes, and users and can run
# behind a load balancer. The IdP therefore requires the db service to be
# running. Point the API's auth.issuer at this IdP's HTTP address (default
# 127.0.0.1:7104) and the API's idp_grpc_address at its gRPC address (default
# 127.0.0.1:7106).
#
# The IdP's gRPC surface (job-token minting and user management) is reached
# only by the API, which authenticates with its mTLS client certificate when the
# tls section is set — so only a CA-signed client (the API) can mint job tokens
# or manage users. audiences are the default audience values stamped on minted
# job tokens (a mint request may override them).
#
# The IdP also hosts the user directory for username/password authentication.
# Its state — the user directory (profiles, bcrypt password hashes, and roles)
# — is persisted through the Database service, like its signing keys and auth
# codes, so multiple IdP replicas share the same users. The API's /api/login
# and /api/register proxy to the IdP's gRPC user operations; the IdP verifies
# the password and mints an OIDC token stamped with the user's roles.
#idp:
#  issuer: http://127.0.0.1:7104
#  grpc_address: 127.0.0.1:7106   # gRPC API-only surface (job tokens + users)
#  key_lifetime: 2160h      # 90 days
#  rotate_before: 336h      # rotate 14 days before expiry
#  token_lifetime: 1h
#  check_interval: 1h       # how often to check whether to rotate
#  # Default audience values stamped on minted job tokens.
#  audiences: [cdrom-api]

# gRPC address of the IdP's API-only surface (job-token minting and user
# management). The API dials it (over mTLS when the tls section is set) to
# mint job tokens and to proxy the UI's username/password requests. Used by
# the api binary; other binaries ignore it. Defaults to 127.0.0.1:7106.
#idp_grpc_address: 127.0.0.1:7106

# Job-token authentication on the API's gRPC surface (used by workers and
# agents). Disabled by default: when enabled is false (or unset) the API
# accepts gRPC calls without a job token. When enabled, the API mints a job
# token from the IdP (via the IdP's gRPC MintJobToken RPC, authenticating with
# its mTLS client certificate) for every job it dispatches or hands to an
# agent, and requires callers to present it as a Bearer token on ReportJobStatus
# and artifact operations. The token is scoped to a single job; a token for one
# job is rejected on another. The main job token's exp is a long placeholder
# (a week) so it effectively never expires: the API gates its validity on the
# job's live status in the database, so a token is invalidated the moment the
# job stops running. A job can also request a new token for a different
# audience (e.g. an outside resource it must call) via the ExchangeJobToken
# RPC; an exchanged token has a short lifetime (the request's expires_in, or
# the default below when unset).
#
# idp_address is the IdP's HTTP address (for OIDC discovery of the IdP's JWKS,
# used to verify job tokens); the minting itself goes to the IdP's gRPC surface
# (idp_grpc_address).
#grpc_auth:
#  enabled: true
#  idp_address: http://127.0.0.1:7104
#  audiences: [cdrom-api]
#  # Default lifetime of an exchanged job token (a job may override it per
#  # request via the step's expires_in). Defaults to 15m when unset.
#  exchanged_token_lifetime: 15m

# Secret store (used by the API, F-12). The API is the only component that
# holds the key: it encrypts a pipeline secret's plaintext when the pipeline
# is created or updated, and decrypts the stored ciphertext when it hands a
# job to an execution target (so a step can reference it as
# `{{ .secrets.name }}`). The database service stores the ciphertext opaquely
# and never sees the key. Disabled by default: when key is empty the store is
# off and a pipeline that declares secrets is rejected.
#
# kind selects the store backend. The built-in "aes" store (the default) uses
# AES-256-GCM with a base64-encoded 32-byte key; "vault" and "openbao" are
# reserved for future first-class backends. The nonce counter is kept in the
# database so every API replica draws unique nonces from one shared sequence.
#
# Generate a key with: openssl rand -base64 32
#secrets:
#  kind: aes
#  key: <base64-encoded 32-byte AES-256 key>

# Audit log (used by the API, F-15). An append-only record of significant
# actions — who (actor) did what (action) to which resource (target), when,
# from where (source IP), with what outcome, and what changed (old/new value).
# Each audited action is written both to a local audit log file (separate from
# the process's default log) and to the shared audit log in the database
# (queryable via GET /api/audit). A secret's value is never stored or
# displayed: a secret is represented by its name only.
#
# file is the path of the current audit log file (default: audit.log). It is
# separate from the process's default log (log_file / CDROM_LOG_FILE). A value
# of "-" writes the audit log to stdout instead of a file (no rotation).
#
# format is the record format: "json" (the default) or "text".
#
# rotation is the file rotation interval: "hourly" or "daily" (the default).
# The current file keeps a stable name (file); on rotation the file being
# closed is renamed with the day/hour appended (e.g. audit.log ->
# audit.log-20261009 for a daily rotation, or audit.log-2026100914 for an
# hourly one) and a fresh file is opened at the stable path.
#
# retention is the maximum age of audit entries kept in the database before
# they are pruned (default: 2160h / 90 days). Zero disables age-based pruning.
#
# prune_interval is how often the database's audit log is pruned of entries
# older than retention (default: 24h).
#audit:
#  file: audit.log
#  format: json
#  rotation: daily
#  retention: 2160h
#  prune_interval: 24h
